<style>
:root{--bg:#0c0a0b;--p1:#161214;--p2:#1e191c;--p3:#261f23;--ac:#d4919a;--acl:#e8b5bc;--acs:#3a2529;--ag:linear-gradient(135deg,#d4919a,#c47a8a,#b06878);--t1:#f5eaec;--t2:#b5a3a7;--t3:#786a6d;--bd:#2a2225;--bds:#3d3235;--dg:#d4717a;--dgs:#3a2025;--sc:#94b88a;--r1:10px;--r2:16px;--r3:24px;--rf:100px;--tr:all .25s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--t1);font-family:'DM Sans',-apple-system,sans-serif;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}

.logout:hover{color:var(--dg);border-color:var(--dg)}
.lw{max-width:420px;margin:8vh auto;background:var(--p1);border:1px solid var(--bd);border-radius:var(--r3);padding:48px 40px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5),0 0 30px rgba(212,145,154,.08);position:relative;overflow:hidden}
.lw::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ag)}

.ig{text-align:left;margin-bottom:14px}.ig label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:6px;font-weight:500}
input,select{width:100%;background:var(--p2);border:1px solid var(--bds);color:var(--t1);border-radius:var(--r1);padding:12px 16px;font-size:14px;font-family:inherit;transition:var(--tr);outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,145,154,.12)}
input::placeholder{color:var(--t3)}

.tabs{display:flex;gap:4px;margin-bottom:28px;padding:4px;background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);overflow-x:auto}

.avatar{width:34px;height:34px;border-radius:50%;background:var(--ag);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--bg);flex-shrink:0}
.dir .name{font-size:13px;font-weight:500}.dir .role{font-size:10px;color:var(--t3)}
.main{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);display:flex;flex-direction:column;min-height:540px;overflow:hidden}
.chat-tgt{padding:16px 22px;border-bottom:1px solid var(--bd);font-size:13px;color:var(--t2);background:var(--p2)}.chat-tgt b{color:var(--ac)}

.msg.ceo{margin-left:auto;background:var(--ag);color:var(--bg);border-radius:18px 18px 4px 18px;padding:12px 18px;font-weight:500}

.msg.typing span:nth-child(2){animation-delay:.15s}.msg.typing span:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-4px)}}
.compose{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--bd);background:var(--p2)}
.compose input{flex:1;margin:0}.compose button{background:var(--ag);color:var(--bg);border:none;border-radius:var(--r1);padding:0 24px;font-weight:600;cursor:pointer;font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd)}
th{color:var(--t3);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:1px}
.panel{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);padding:24px}
.empty{color:var(--t3);font-size:13px;padding:28px;text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{margin:0}
select{background:var(--p2);border:1px solid var(--bds);color:var(--t1);border-radius:var(--r1);padding:10px 14px;font-size:13px;font-family:inherit}
.btn-s{background:var(--p2);color:var(--t1);border:1px solid var(--bds);border-radius:var(--r1);padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:var(--tr)}
.btn-s:hover{border-color:var(--ac)}
.btn-sm{font-size:11px;padding:7px 14px;border-radius:var(--r1);border:1px solid var(--bds);background:var(--p1);color:var(--t1);cursor:pointer;font-family:inherit}
.btn-sm.ok{background:var(--sc);border-color:var(--sc);color:var(--bg)}.btn-sm.no{background:var(--dg);border-color:var(--dg);color:var(--bg)}
.pill{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:4px 12px;border-radius:var(--rf);background:var(--acs);color:var(--ac);font-weight:600}
.kit-card{border:1px solid var(--bds);border-radius:var(--r2);padding:20px;margin-bottom:16px;background:var(--p2)}
.kit-card h3{margin:8px 0 6px;font-size:16px;font-family:'Playfair Display',serif;font-weight:500}
.il{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}.il:last-child{border-bottom:none}
.callout{background:var(--acs);border:1px solid rgba(212,145,154,.25);border-radius:var(--r1);padding:14px 16px;font-size:13px;margin-top:14px;word-break:break-all}
.link-token{color:var(--ac);font-weight:600}
.st{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);margin:24px 0 12px;font-weight:600}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.dc{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);padding:22px}
.dc .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);font-weight:600;margin-bottom:10px}
.dc .value{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;line-height:1}
.dc .sub{font-size:12px;color:var(--t2);margin-top:8px}
.dc.accent{border-color:rgba(212,145,154,.25);background:linear-gradient(135deg,var(--p1),var(--acs))}
.pc{background:var(--p2);border:1px solid var(--bds);border-radius:var(--r2);padding:18px;margin:8px 0 18px;font-size:13px}
.pc .risk{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:4px 12px;border-radius:var(--rf);background:var(--acs);color:var(--ac);font-weight:600;margin-bottom:10px}
.pa{display:flex;gap:10px;margin-top:14px}
.pa button{font-size:12px;padding:8px 18px;border-radius:var(--r1);border:1px solid var(--bds);background:var(--p1);color:var(--t1);cursor:pointer;font-family:inherit;transition:var(--tr)}
.pa .approve{background:var(--sc);border-color:var(--sc);color:var(--bg)}.pa .reject{background:var(--dg);border-color:var(--dg);color:var(--bg)}
@media(max-width:720px){.app{padding:16px 14px 60px}.hdr{flex-direction:column;align-items:flex-start;gap:12px}.layout{grid-template-columns:1fr}.council{display:flex;overflow-x:auto;gap:8px;padding:12px;position:static}.council h2{display:none}.dir{flex-direction:column;text-align:center;gap:4px;min-width:68px;flex-shrink:0;border-left:none;border-bottom:3px solid transparent}.dir.active{border-bottom-color:var(--ac)}.dir .role{display:none}.dg{grid-template-columns:1fr 1fr}.transcript{max-height:46vh}.lw{margin:4vh auto;max-width:92vw;padding:32px 24px}.lw-logo{width:160px}.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}.tab{white-space:nowrap;flex-shrink:0;padding:10px 14px;font-size:12px}table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}.panel{padding:16px}.dc .value{font-size:24px}[style*="grid-template-columns:repeat(auto-fit"]{grid-template-columns:1fr !important}[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important}[style*="grid-template-columns:2fr"]{grid-template-columns:1fr !important}.btn-p{padding:16px;font-size:15px}input,select{padding:14px 16px;font-size:15px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<body>
<div id="app" class="app">
<div class="lw">
<img src="/logo-lg.png" alt="SexS" class="lw-logo" />
<h1>Central da CEO</h1>
<p>Acesso restrito à equipe executiva.</p>
<form method="GET" action="/login">
<div class="ig"><label>Usuário</label><input name="username" placeholder="seu usuário" autocomplete="username" required /></div>
<div class="ig"><label>Senha</label><input name="password" placeholder="sua senha" type="password" autocomplete="current-password" required /></div>
<button type="submit" class="btn-p">Entrar</button>
</form>
</div>
</div>
<div class="toast-stack" id="toastStack"></div>
<script>
var S={token:null,user:null,caps:[]};
var execCache={};

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function toast(m,k){var s=$('#toastStack');if(!s)return;var e=document.createElement('div');e.className='toast'+(k==='ok'?' ok':'');e.textContent=m;s.appendChild(e);setTimeout(function(){e.remove()},5000)}
function fmt(c){return'R$ '+(c/100).toFixed(2)}
function can(c){if(!S.caps)return false;if(S.caps.indexOf('*')>=0)return true;return S.caps.indexOf(c)>=0}

// API call usando fetch normal (Render não tem problema de proxy)
function api(path, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    var method = (opts.method || 'GET').toUpperCase();
    var url = path;
    
    // Para GET, adicionar token na query string
    if (method === 'GET' && S.token) {
      url += (url.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(S.token);
    }
    
    xhr.open(method, url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    if (S.token && method !== 'GET') {
      xhr.setRequestHeader('Authorization', 'Bearer ' + S.token);
    }
    
    xhr.onload = function() {
      try {
        var data = JSON.parse(xhr.responseText);
      } catch(e) {
        var data = {};
      }
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(data);
      } else {
        reject(new Error(data.error || ('Erro ' + xhr.status)));
      }
    };
    
    xhr.onerror = function() {
      reject(new Error('Erro de conexão'));
    };
    
    xhr.send(opts.body || null);
  });
}

// ===== LOGIN =====
function init() {
  try {
    // Verificar se há mensagem de erro na URL (ex: /#error=senha+errada)
    var hash = window.location.hash;
    if (hash.indexOf('#error=') === 0) {
      var errorMsg = decodeURIComponent(hash.substring(7));
      renderLogin(errorMsg);
      // Limpar o hash da URL
      history.replaceState(null, '', '/');
      return;
    }
    
    // Verificar se é primeiro acesso de revendedora
    if (hash.indexOf('#primeiro-acesso=') === 0) {
      var firstAccessToken = hash.substring(17);
      renderFirstAccess(firstAccessToken);
      // Limpar o hash da URL
      history.replaceState(null, '', '/');
      return;
    }
    
    // SSR: verificar se o token foi injetado pelo servidor
    if (window.SEXS_TOKEN && window.SEXS_USER) {
      S.token = window.SEXS_TOKEN;
      S.user = window.SEXS_USER;
      S.caps = window.SEXS_CAPS || [];
      try { localStorage.setItem('sexsos_token', S.token); } catch(e) {}
      renderApp();
      return;
    }
    
    var saved = null;
    try { saved = localStorage.getItem('sexsos_token'); } catch(e) {}
    if (saved) { S.token = saved; loadUser(); return; }
    renderLogin();
  } catch(e) {
    // Fallback: se qualquer coisa falhar, mostrar login
    try { localStorage.removeItem('sexsos_token'); } catch(e2) {}
    var root = document.getElementById('app');
    if (root) {
      root.innerHTML = '<div class="lw"><img src="/logo-lg.png" alt="SexS" class="lw-logo" /><h1>Central da CEO</h1><p>Acesso restrito.</p>' +
        '<form method="GET" action="/login">' +
        '<div class="ig"><label>Usuário</label><input name="username" placeholder="seu usuário" required /></div>' +
        '<div class="ig"><label>Senha</label><input name="password" type="password" placeholder="sua senha" required /></div>' +
        '<button type="submit" class="btn-p">Entrar</button></form></div>';
    }
  }
}

// ===== PRIMEIRO ACESSO DA REVENDEDORA =====
function renderFirstAccess(token) {
  var root = $('#app'); root.innerHTML = '';
  root.appendChild(el(
    '<div class="lw">' +
    '<img src="/logo-lg.png" alt="SexS" class="lw-logo" />' +
    '<h1>Bem-vinda! 🌸</h1>' +
    '<p>Crie sua senha pessoal para acessar o portal. Ninguém mais vai vê-la.</p>' +
    '<div id="faError" class="error" style="display:none"></div>' +
    '<div class="ig"><label>Nova senha</label><input id="faPassword" type="password" placeholder="mínimo 8 caracteres" /></div>' +
    '<div class="ig"><label>Confirme a senha</label><input id="faPasswordConfirm" type="password" placeholder="repita a senha" /></div>' +
    '<button class="btn-p" id="faBtn" onclick="submitFirstAccess(\'' + token + '\')">Criar senha e entrar</button>' +
    '</div>'
  ));
}

async function submitFirstAccess(token) {
  var password = $('#faPassword').value;
  var confirm = $('#faPasswordConfirm').value;
  var errBox = $('#faError');

  if (password.length < 8) {
    errBox.textContent = 'A senha precisa ter pelo menos 8 caracteres.';
    errBox.style.display = 'block';
    return;
  }
  if (password !== confirm) {
    errBox.textContent = 'As senhas não conferem. Tente novamente.';
    errBox.style.display = 'block';
    return;
  }

  try {
    var res = await fetch('/api/first-access/' + token + '/set-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: password})
    });
    var data = {};
    try { data = await res.json(); } catch(e) {}
    if (!res.ok) throw new Error(data.error || 'Erro ao criar senha');

    // Senha criada! Mostrar tela com o username
    history.replaceState(null, '', '/');
    renderLoginSuccess(data.username, data.name);
  } catch(e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
  }
}

// Tela de sucesso após criar senha — mostra o username para a revendedora
function renderLoginSuccess(username, name) {
  var root = $('#app'); root.innerHTML = '';
  root.appendChild(el(
    '<div class="lw">' +
    '<img src="/logo-lg.png" alt="SexS" class="lw-logo" />' +
    '<h1>Senha criada! 🎉</h1>' +
    '<p style="margin-bottom:16px">Prontinho, ' + esc(name || 'revendedora') + '! Sua senha foi criada com sucesso.</p>' +
    '<div class="callout" style="margin-bottom:24px;text-align:center">' +
    '<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:8px">Seu usuário para login:</div>' +
    '<div style="font-size:22px;font-family:Playfair Display,serif;font-weight:600;color:var(--ac)">' + esc(username) + '</div>' +
    '</div>' +
    '<div class="hint" style="margin-bottom:20px">⚠️ Anote esse usuário! Você vai precisar dele junto com a senha que acabou de criar.</div>' +
    '<form method="GET" action="/login">' +
    '<div class="ig"><label>Usuário</label><input name="username" value="' + esc(username) + '" autocomplete="username" /></div>' +
    '<div class="ig"><label>Senha</label><input name="password" type="password" placeholder="a senha que você acabou de criar" autocomplete="current-password" required /></div>' +
    '<button type="submit" class="btn-p">Entrar no meu portal</button>' +
    '</form>' +
    '</div>'
  ));
}

async function loadUser() {
  try {
    var me = await api('/api/me');
    S.user = me.user;
    S.caps = me.capabilities || [];
    try { localStorage.setItem('sexsos_token', S.token); } catch(e) {}
    renderApp();
  } catch(e) {
    console.error('loadUser error:', e);
    S.token = null;
    try { localStorage.removeItem('sexsos_token'); } catch(e) {}
    renderLogin('Erro: ' + e.message + '. Tente novamente.');
  }
}

function renderLogin(errMsg) {
  var root = $('#app'); root.innerHTML = '';
  root.appendChild(el(
    '<div class="lw">' +
    '<img src="/logo-lg.png" alt="SexS" class="lw-logo" />' +
    '<h1>Central da CEO</h1>' +
    '<p>Acesso restrito à equipe executiva.</p>' +
    (errMsg ? '<div class="error">' + esc(errMsg) + '</div>' : '') +
    '<form method="GET" action="/login">' +
    '<div class="ig"><label>Usuário</label><input name="username" placeholder="seu usuário" autocomplete="username" required /></div>' +
    '<div class="ig"><label>Senha</label><input name="password" placeholder="sua senha" type="password" autocomplete="current-password" required /></div>' +
    '<button type="submit" class="btn-p">Entrar</button>' +
    '</form></div>'
  ));
}

function logout() {
  var t = S.token; S.token = null;
  try { localStorage.removeItem('sexsos_token'); } catch(e) {}
  if (t) api('/api/auth/logout', {method:'POST'}).catch(function(){});
  renderLogin();
}

// ===== APP PRINCIPAL =====
async function renderApp() {
  try {
    if (!S.user) {
      return renderLogin();
    }
    if (S.user.role === 'revendedora') return renderPortal();
    
    var tabs = [];

function switchTab(tab) {
  // Remove active class from all tabs and views
  var btns = $$('.tab'); 
  var views = $$('.view');
  btns.forEach(function(b){b.classList.remove('active')});
  views.forEach(function(v){v.classList.remove('active')});
  
  // Find and activate the correct button by matching onclick
  btns.forEach(function(btn) {
    var onclick = btn.getAttribute('onclick');
    if (onclick && onclick.includes("switchTab('" + tab + "')")) {
      btn.classList.add('active');
    }
  });
  
  // Activate the correct view by ID
  var view = document.getElementById('v-'+tab);
  if (view) view.classList.add('active');
  
  // Call the render function
  var r = {
    dashboard:renderDashboard,
    resellers:renderResellers,
    orders:renderOrders,
    kits:renderKits,
    kitmontar:renderKitBuilder,
    'products-resellers':renderProductsResellers,
    financial:renderFinancial,
    goals:renderGoals,
    stock:renderStock,
    kitdetails:renderKitDetails,
    resellerMsgs:renderResellerMessages,
    audit:renderAudit,
    'mentor-portals':renderMentorPortals,
    'purchase':renderPurchasePlan,
    'coverage':renderCoverage
  };
  if (r[tab]) r[tab]();
}

function ppLinhasFiltradas() {
  var d = PP.dados; if (!d) return [];
  var ls = d.linhas || [];
  if (PP.filtro === 'todos') return ls;
  if (PP.filtro === 'sem') return ls.filter(function (l) { return l.origem_preco === 'histórico'; });
  return ls.filter(function (l) { return l.fornecedor_indicado === PP.filtro; });
}

function ppCsv() {
  var ls = ppLinhasFiltradas();
  var head = ['produto', 'quantidade', 'para (revendedora)', 'custo unit.', 'total', 'fornecedor indicado',
              'código no fornecedor', 'estoque do fornecedor', 'preço Atacadão', 'preço Gall (PIX)',
              'economia por unidade', 'origem do preço', 'qtd por histórico', 'por que essa qtd', 'link', 'lido em'];
  var linhas = ls.map(function (l) {
    var at = null, ga = null;
    (l.opcoes || []).forEach(function (o) {
      if (/atacad/i.test(o.fornecedor)) at = o.custo_cents;
      if (/gall/i.test(o.fornecedor)) ga = o.custo_cents;
    });
    return [l.name, l.quantity, (l.para || []).join(' + '), l.custo_unit_cents ? (l.custo_unit_cents / 100).toFixed(2) : '',
            l.custo_total_cents ? (l.custo_total_cents / 100).toFixed(2) : '', l.fornecedor_indicado || 'sem vínculo',
            l.fornecedor_ref || '', l.fornecedor_estoque == null ? '' : l.fornecedor_estoque,
            at ? (at / 100).toFixed(2) : '', ga ? (ga / 100).toFixed(2) : '',
            l.economia_unit_cents ? (l.economia_unit_cents / 100).toFixed(2) : '', l.origem_preco,
            l.qtd_por_historico || '', l.qtd_motivo || '', l.fornecedor_url || '', l.lido_em || ''];
  });
  var csv = head.join(';') + '\n' + linhas.map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(';');
  }).join('\n');
  var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'compra_' + (PP.filtro === 'todos' ? 'todos' : PP.filtro.replace(/\W+/g, '_')) + '_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  toast('CSV com ' + linhas.length + ' linhas baixado', 'ok');
}

          '<td style="text-align:left;font-size:11px">' + esc((x.por_revendedora || []).map(function (r) { return r.revendedora + ' ' + r.unidades + 'u'; }).join(', ')) + '</td></tr>';
      }).join('') + '</table></div></div>';

  var semV = (d.linhas || []).filter(function (l) { return l.origem_preco === 'histórico'; });
  if (semV.length) {
    h += '<div class="panel" style="margin-top:14px"><div style="font-weight:700;font-size:13px;margin-bottom:6px">' +
      '🔗 ' + semV.length + ' produto(s) sem vínculo com fornecedor</div>' +
      '<div style="font-size:12px;color:var(--t2)">Sem o link do fornecedor eu não consigo dizer onde está mais barato — ' +

      '(ou o nome no site) que eu cadastro o vínculo e a próxima leitura já sai comparada.</div>' +
      '<div style="margin-top:8px">' + ((d.sem_vinculo_com_link || []).map(function (x) {
        return '<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--bd)">' +
          esc(x.qtd) + '× <b>' + esc(x.name) + '</b> · pra ' + esc((x.para || []).join(', ') || '—') +

          ' <span style="color:var(--t3);font-size:11px">(' + esc(x.qtd_motivo || '') + ')</span></div>';
      }).join('')) + '</div></div>';
  }
  v.innerHTML = h;
}

function ppAbrirCarrinho(fornecedor) {
  var d = PP.dados || {};
  var f = (d.fornecedores || []).filter(function (x) { return x.fornecedor === fornecedor; })[0];
  if (!f) { toast('fornecedor não encontrado'); return; }
  if (f.link_carrinho) { window.open(f.link_carrinho, '_blank', 'noopener'); return; }
  // A Gall não tem deep link de carrinho: abro o primeiro item e listo os outros para clicar.
  var u = (f.produtos || []).map(function (x) { return x.url; }).filter(Boolean)[0];
  if (u) { window.open(u, '_blank', 'noopener'); toast('abrindo 1 de ' + (f.produtos.length) + ' — os outros estão no bloco do carrinho abaixo'); }
  else toast('nenhum item desse fornecedor tem link cadastrado');
}

// ===== DASHBOARD =====
async function renderDashboard() {
  var v = $('#v-dashboard'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    var [data, chartsData] = await Promise.all([
      api('/api/dashboard'),
      api('/api/dashboard/charts')
    ]);
    
    var d = data.dashboard; 
    var f = d.financial;
    var charts = chartsData.charts || {};
    var alerts = chartsData.alerts || [];
    
    // Cinco números que pedem atitude. O resto (gráficos, atividade, vitrine) vai para
    // dentro de um bloco dobrável — era 11 painéis abertos na mesma tela.
    var kbs = d.kits_by_status || {};
    var porStatus = Array.isArray(kbs) ? kbs.reduce(function(m,x){ m[x.status] = (m[x.status]||0) + (x.count||x.total||1); return m; }, {}) : kbs;
    var kitsAbertos = Object.keys(porStatus).reduce(function(s,k){ return (k==='encerrado'||k==='rejeitado') ? s : s+(porStatus[k]||0); }, 0);
    var naHistorico = (porStatus.encerrado||0) + (porStatus.rejeitado||0);
    var aReceber = f.valor_a_receber_pendente_cents || 0;
    var cardsHtml = '<div class="dg">' +
      '<div class="dc accent"><div class="label">💎 Lucro Líquido</div><div class="value">'+fmt(f.lucro_liquido_cents)+'</div><div class="sub">após comissões, despesas e CMV</div></div>' +
      '<div class="dc"><div class="label">⏳ Comissão a pagar</div><div class="value" style="color:'+(f.comissao_a_pagar_cents?'#f87171':'#4ade80')+'">'+fmt(f.comissao_a_pagar_cents)+'</div><div class="sub">pago até agora: '+fmt(f.comissao_paga_cents)+'</div></div>' +
      '<div class="dc"><div class="label">💵 Acertos a receber</div><div class="value" style="color:'+(aReceber?'#f87171':'#4ade80')+'">'+fmt(aReceber)+'</div><div class="sub">'+(f.valor_recebido_cents ? 'recebido '+fmt(f.valor_recebido_cents) : 'nenhum recebimento lançado')+'</div></div>' +
      '<div class="dc"><div class="label">📦 Kits na rua</div><div class="value">'+kitsAbertos+'</div><div class="sub">'+naHistorico+' no histórico · '+(d.low_stock_products.length)+' produtos abaixo do mínimo</div></div>' +
      '<div class="dc"><div class="label">📊 Vendas Hoje</div><div class="value">'+d.today.sales_today_count+'</div><div class="sub">'+fmt(d.today.revenue_informed_today_cents)+'</div></div>' +
      '</div>';
    
    // Alertas
    var alertsHtml = '';
    if (alerts.length > 0) {
      alertsHtml = '<div class="panel" style="margin-bottom:20px;border-color:var(--dg);background:linear-gradient(135deg, rgba(212,113,122,.05), rgba(212,113,122,.02))">' +
        '<div class="st" style="margin-top:0;color:var(--dg)">🔔 Alertas Importantes</div>' +
        alerts.map(function(a) {
          var color = a.type === 'danger' ? 'var(--dg)' : '#ffa500';
          return '<div class="il" style="padding:10px 0"><span style="color:'+color+'">'+a.icon+' '+esc(a.message)+'</span></div>';
        }).join('') +
        '</div>';
    }
    
    // Gráficos
    var chartsHtml = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">' +
      '<div class="panel" style="margin:0"><div class="st" style="margin-top:0">📈 Vendas por Revendedora</div><canvas id="chartResellers" style="max-height:300px"></canvas></div>' +
      '<div class="panel" style="margin:0"><div class="st" style="margin-top:0">📊 Tendência de Vendas</div><canvas id="chartTrend" style="max-height:300px"></canvas></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">' +
      '<div class="panel" style="margin:0"><div class="st" style="margin-top:0">🏆 Top 5 Produtos</div><canvas id="chartProducts" style="max-height:300px"></canvas></div>' +
      '<div class="panel" style="margin:0"><div class="st" style="margin-top:0">📦 Status dos Kits</div><canvas id="chartKits" style="max-height:300px"></canvas></div>' +
      '</div>' +
      '<div class="panel" style="margin-bottom:20px"><div class="st" style="margin-top:0">🏅 Produto que cada revendedora mais vende</div><canvas id="chartTopProductReseller" style="max-height:340px"></canvas></div>';
    
    // Estoque baixo
    var lowStockHtml = '';
    if (d.low_stock_products.length > 0) {
      lowStockHtml = '<div class="panel" style="margin-bottom:20px;border-color:var(--dg)">' +
        '<div class="st" style="margin-top:0;color:var(--dg)">⚠️ Estoque Baixo</div>' + 
        d.low_stock_products.slice(0, 10).map(function(p) {
          return '<div class="il"><span>'+esc(p.name)+'</span><span style="color:var(--dg)">'+p.available_balance+' un. (mín: '+p.low_stock_threshold+')</span></div>';
        }).join('') + 
        '</div>';
    }
    
    // Atividade recente
    var activityHtml = '<div class="panel"><div class="st" style="margin-top:0">📝 Atividade Recente</div>' + 
      (d.recent_audit.length ? d.recent_audit.map(function(a) {
        return '<div class="il"><span>'+esc(a.actor_label)+' — '+esc(a.action)+'</span><span style="color:var(--t3);font-size:11px">'+esc(a.created_at)+'</span></div>';
      }).join('') : '<div class="empty">Sem atividade ainda.</div>') + 
      '</div>';
    
    // Vitrine pública (catálogo da cliente final) — só a CEO configura
    var catalogHtml = (S.user.role === 'ceo') ? '<div class="panel" style="margin-bottom:20px"><div class="st" style="margin-top:0">🌐 Catálogo público <span style="font-weight:400;font-size:11px;color:var(--t3)">— vitrine da cliente, sem preço</span></div><div id="catBox" class="empty">Carregando…</div></div>' : '';

    var maisHtml = '<details class="panel" style="margin-bottom:20px"><summary style="cursor:pointer;font-weight:600;font-size:13px">📊 Gráficos, atividade recente e vitrine pública <span style="font-weight:400;color:var(--t3);font-size:11px">— nada disso some, só sai do caminho</span></summary><div style="margin-top:14px">' + chartsHtml + catalogHtml + activityHtml + '</div></details>';
    v.innerHTML = cardsHtml + alertsHtml + lowStockHtml + maisHtml;
    var det = v.querySelector('details');
    if (det) det.addEventListener('toggle', function(){ if (det.open) setTimeout(function(){ renderCharts(charts); loadCatalogPanel(); }, 80); });
    
    // Renderizar gráficos após o HTML estar no DOM
    setTimeout(function() {
      renderCharts(charts);
      loadCatalogPanel();
    }, 100);
    
  } catch(e) { 
    v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; 
  }
}

/** Painel do catálogo público: liga/desliga a vitrine e define o contato do estoque.
 * O catálogo em si é a página /catalogo, alimentada por GET /api/public/catalog. */
function loadCatalogPanel() {
  var box = document.getElementById('catBox');
  if (!box || !S.user || S.user.role !== 'ceo') return;
  api('/api/admin/catalog-settings').then(function (d) {
    var st = d.settings || {}, pv = d.preview || {};
    var prods = pv.products || [];
    var ready = prods.filter(function (p) { return p.available; }).length;
    var withStock = (pv.resellers || []).filter(function (r) { return r.products_available > 0; });
    box.innerHTML = '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px">' +
      '<div class="ig" style="flex:1;min-width:150px;margin-bottom:0"><label>Nome de contato do estoque</label><input id="catLabel" value="' + esc(st.contact_label || '') + '" placeholder="CEO-Jéssica" /></div>' +
      '<div class="ig" style="flex:1;min-width:150px;margin-bottom:0"><label>WhatsApp (com DDD)</label><input id="catWa" value="' + esc(st.contact_whatsapp || '') + '" placeholder="(16) 99999-9999" /></div>' +
      '<div class="ig" style="flex:1;min-width:170px;margin-bottom:0"><label>Categorias com foto censurada</label><input id="catCens" value="' + esc(st.censored_categories || '') + '" placeholder="Próteses, Anal" /></div>' +
      '<label class="ig" style="display:flex;align-items:center;gap:7px;margin-bottom:0;min-width:140px;font-size:13px;cursor:pointer;text-align:left">' +
        '<input type="checkbox" id="catOn" style="width:auto;margin:0" ' + (st.enabled ? 'checked' : '') + ' /><span style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--t1)">catálogo no ar</span></label>' +
      '<button class="btn-s" style="background:var(--sc);color:var(--bg)" onclick="saveCatalogSettings()">salvar</button>' +
      '<a class="btn-s" href="/catalogo" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">abrir catálogo ↗</a>' +
      '</div>' +
      '<div class="il"><span>Produtos na vitrine</span><span>' + prods.length + ' · ' + ready + ' prontos para enviar</span></div>' +
      '<div class="il"><span>Queridinhos do momento</span><span>' + (function () {
        var hot = prods.filter(function (p) { return p.hot; }).sort(function (a, b) { return a.hot.rank - b.hot.rank; });
        if (!hot.length) return 'sem venda registrada ainda — a faixa fica escondida na vitrine';
        var dias = (pv.trending || {}).days;
        return hot.length + ' na vitrine · ' + (dias ? 'contando os últimos ' + dias + ' dias' : 'histórico inteiro (nenhuma venda nos ' + 60 + ' dias)')
          + ' — ' + hot.map(function (p) { return esc(p.name) + ' (' + p.hot.units + ')'; }).join(', ');
      })() + '</span></div>' +
      '<div class="il"><span>Revendedoras com produto pronto</span><span>' + (withStock.length ? withStock.map(function (r) { return esc(r.name) + ' (' + r.products_available + ')'; }).join(' · ') : 'nenhuma no momento') + '</span></div>' +
      '<div class="il"><span>Cartões com foto censurada</span><span>' + (function () {
        var cen = prods.filter(function (p) { return p.censored; });
        if (!cen.length) return 'nenhum';
        return cen.length + ' cards — ' + cen.slice(0, 4).map(function (p) { return esc(p.name); }).join(', ') + (cen.length > 4 ? '…' : '') + ' (no lugar da foto vai o símbolo 18+; o card continua na vitrine)';
      })() + '</span></div>' +
      '<div class="il"><span>Contato do estoque</span><span>' + (st.contact_whatsapp ? esc(st.contact_whatsapp) : '<span style="color:var(--dg)">sem número — a cliente cairia no WhatsApp genérico</span>') + '</span></div>' +
      (st.updated_at ? '<div class="il"><span>Última alteração</span><span style="color:var(--t3);font-size:11px">' + esc(st.updated_at) + '</span></div>' : '');
  }).catch(function (e) {
    box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  });
}

function saveCatalogSettings() {
  api('/api/admin/catalog-settings', { method: 'POST', body: JSON.stringify({
    enabled: document.getElementById('catOn').checked,
    contact_label: document.getElementById('catLabel').value,
    contact_whatsapp: document.getElementById('catWa').value,
    censored_categories: document.getElementById('catCens').value,
  }) }).then(function () {
    toast('Configurações do catálogo salvas', 'ok');
    loadCatalogPanel();
  }).catch(function (e) { toast('Não salvou: ' + e.message, 'err'); });
}

function renderCharts(charts) {
  // Cores do tema
  var colors = ['#d4919a', '#e8b5bc', '#c47a8a', '#b06878', '#94b88a', '#ffa500', '#4ade80', '#60a5fa', '#f472b6', '#a78bfa'];
  
  Chart.defaults.color = '#b5a3a7';
  Chart.defaults.borderColor = '#2a2225';
  Chart.defaults.font.family = "'DM Sans', sans-serif";
  
  // 1. Gráfico de vendas por revendedora (barras horizontais)
  var ctxResellers = document.getElementById('chartResellers');
  if (ctxResellers && charts.sales_by_reseller && charts.sales_by_reseller.length > 0) {
    new Chart(ctxResellers, {
      type: 'bar',
      data: {
        labels: charts.sales_by_reseller.map(r => r.name),
        datasets: [{
          label: 'Vendas (R$)',
          data: charts.sales_by_reseller.map(r => r.total_cents / 100),
          backgroundColor: colors.slice(0, charts.sales_by_reseller.length),
          borderColor: colors.slice(0, charts.sales_by_reseller.length),
          borderWidth: 1
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: {
            beginAtZero: true,
            ticks: {
              callback: function(value) {
                return 'R$ ' + value.toFixed(2);
              }
            }
          }
        }
      }
    });
  }
  
  // 2. Gráfico de tendência de vendas (linha)
  var ctxTrend = document.getElementById('chartTrend');
  if (ctxTrend && charts.sales_trend && charts.sales_trend.length > 0) {
    new Chart(ctxTrend, {
      type: 'line',
      data: {
        labels: charts.sales_trend.map(t => t.month),
        datasets: [{
          label: 'Faturamento (R$)',
          data: charts.sales_trend.map(t => t.total_cents / 100),
          borderColor: '#d4919a',
          backgroundColor: 'rgba(212, 145, 154, 0.1)',
          tension: 0.4,
          fill: true
        }, {
          label: 'Kits Fechados',
          data: charts.sales_trend.map(t => t.kits_count),
          borderColor: '#94b88a',
          backgroundColor: 'rgba(148, 184, 138, 0.1)',
          tension: 0.4,
          fill: false,
          yAxisID: 'y1'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { position: 'top' }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: function(value) {
                return 'R$ ' + value.toFixed(0);
              }
            }
          },
          y1: {
            position: 'right',
            beginAtZero: true,
            grid: { drawOnChartArea: false }
          }
        }
      }
    });
  }
  
  // 3. Gráfico de top produtos (barras)
  var ctxProducts = document.getElementById('chartProducts');
  if (ctxProducts && charts.top_products && charts.top_products.length > 0) {
    var top5 = charts.top_products.slice(0, 5);
    new Chart(ctxProducts, {
      type: 'bar',
      data: {
        labels: top5.map(p => p.name.length > 20 ? p.name.substring(0, 20) + '...' : p.name),
        datasets: [{
          label: 'Unidades Vendidas',
          data: top5.map(p => p.units_sold),
          backgroundColor: colors.slice(0, top5.length),
          borderColor: colors.slice(0, top5.length),
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  }
  
  // 4. Gráfico de status dos kits (pizza)
  var ctxKits = document.getElementById('chartKits');
  if (ctxKits && charts.kits_by_status && charts.kits_by_status.length > 0) {
    var statusLabels = {
      'sugerido': 'Sugeridos',
      'aprovado': 'Aprovados',
      'em_preparacao': 'Em Preparação',
      'entregue': 'Entregues',
      'aguardando_fechamento': 'Aguardando',
      'encerrado': 'Encerrados',
      'rejeitado': 'Rejeitados'
    };
    
    new Chart(ctxKits, {
      type: 'doughnut',
      data: {
        labels: charts.kits_by_status.map(k => statusLabels[k.status] || k.status),
        datasets: [{
          data: charts.kits_by_status.map(k => k.count),
          backgroundColor: colors.slice(0, charts.kits_by_status.length),
          borderColor: '#161214',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: {
            position: 'bottom',

async function loadTranscript() {
  var box = $('#transcript'); if(!box) return;
  try {
    var data = await api('/api/conversations/' + S.thread);
    box.innerHTML = '';
    if (!data.messages.length) { box.innerHTML = '<div class="empty">Nenhuma mensagem ainda. Diga "resumo" para começar ou conte um acontecimento.</div>'; return; }
    data.messages.forEach(function(m) {
      var bubble = el('<div class="msg '+(m.sender==='ceo'?'ceo':'agente')+'"></div>');
      bubble.textContent = m.body;
      box.appendChild(bubble);
      if (m.proposal_id) renderProposalInline(m.proposal_id, box);
    });
    box.scrollTop = box.scrollHeight;
  } catch(e) { box.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}

async function renderProposalInline(pid, container) {
  try {
    var data = await api('/api/proposals');
    var p = data.proposals.find(function(x){return x.id === pid});
    if (!p) return;
    var card = el('<div class="pc"></div>');
    var firstAccess = execCache[p.id] && execCache[p.id].firstAccessToken;
    var credentials = execCache[p.id] && execCache[p.id].username && execCache[p.id].password;
    card.innerHTML = '<span class="risk">risco '+esc(p.risk_level)+'</span><div><b>Proposta #'+p.id+'</b> — '+esc(p.intent.replace(/_/g,' '))+'</div>' +

      '<div style="font-size:12px;color:var(--t3);margin-top:6px">status: '+esc(p.status)+'</div>' +
      (p.status==='pendente' ? '<div class="pa"><button class="approve" onclick="decideProposal('+p.id+',\'approve\')">Aprovar</button><button class="reject" onclick="decideProposal('+p.id+',\'reject\')">Rejeitar</button></div>' : '') +
      (credentials ? '<div class="callout" style="margin-top:12px"><b>🔑 Credenciais da revendedora:</b><br><br>👤 Login: <b style="color:var(--ac);font-size:16px">'+esc(execCache[p.id].username)+'</b><br>🔒 Senha: <b style="color:var(--ac);font-size:16px">'+esc(execCache[p.id].password)+'</b><br><br><span style="font-size:11px;color:var(--t3)">Envie esses dados para a revendedora acessar:<br>'+location.origin+'</span></div>' : '') +
      (firstAccess ? '<div class="callout">Link de primeiro acesso:<br><span class="link-token">'+location.origin+'/#primeiro-acesso/'+firstAccess+'</span></div>' : '');

async function decideProposal(id, action) {
  try {
    var data = await api('/api/proposals/'+id+'/'+action, {method:'POST', body:'{}'});
    if (data.proposal && data.proposal.execution_result) execCache[id] = data.proposal.execution_result;
    toast('Proposta ' + (action==='approve'?'aprovada':'rejeitada') + '!', 'ok');
    await loadTranscript();
  } catch(e) { toast(e.message); }
}

function showTyping() { var box=$('#transcript'); if(!box) return; box.appendChild(el('<div class="msg agente typing" id="typingInd"><span></span><span></span><span></span></div>')); box.scrollTop=box.scrollHeight; }
function hideTyping() { var t=$('#typingInd'); if(t) t.remove(); }

async function sendMsg() {
  var input = $('#msgInput'); if(!input) return;
  var text = input.value.trim(); if(!text) return;
  input.value = '';
  showTyping();
  try {
    var result = await api('/api/messages', {method:'POST', body:JSON.stringify({thread:S.thread, text:text})});
    if (result.routed_to && result.routed_to !== S.thread) { S.thread = result.routed_to; await renderChat(); }
    else { hideTyping(); await loadTranscript(); }
  } catch(e) { hideTyping(); toast(e.message); }
}

async function createReseller() {
  var name = $('#newResName').value.trim();
  var phone = $('#newResPhone').value.trim();
  var commission = parseFloat($('#newResCommission').value) || 25;
  var addrEl = $('#newResAddress'), cepEl = $('#newResCep');
  var addr = addrEl ? addrEl.value.trim() : '';
  var cep = cepEl ? cepEl.value.trim() : '';
  
  if (!name) { toast('Informe o nome da revendedora'); return; }
  
  try {
    var criado = await api('/api/resellers', {
      method: 'POST',
      body: JSON.stringify({
        name: name,
        phone: phone,
        commission_pct: commission / 100,
        address: ([addr, cep].filter(Boolean).join(' – CEP ') || null)
      })
    });
    toast('Revendedora cadastrada com sucesso!', 'ok');
    if ((addr || cep) && criado && criado.id) {
      try {
        var g = await api('/api/admin/coverage/locate', { method: 'POST', body: JSON.stringify({ reseller_id: criado.id, cep: cep, address: addr }) });
        toast('Já cravada no mapa 🗺️' + (g.bairro ? ' · bairro ' + g.bairro : ''), 'ok');
      } catch (e) {
        toast('Endereço salvo, mas o mapa não achou — posicione na aba 🗺️ Abrangência');
      }
    }
    renderResellers();
  } catch(e) {
    toast('Erro: ' + e.message);
  }
}

// ABA À PARTE de montagem: o formulário de criar kit e o simulador de plano. A lista de
// kits (aba 📦 Kits) é o painel de fechamento da CEO e não deve competir com formulário
// na mesma tela — foi o que a CEO pediu depois do painel do simulador entrar ali.
async function renderKitBuilder() {
  var v = $('#v-kitmontar'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    var [resData, prodData] = await Promise.all([api('/api/resellers'), api('/api/products')]);
    // Os kits que ela acabou de sugerir (antes ficavam na aba 📋 Pedidos): aqui dá para
    // tirar/acrescentar item e aprovar. Se essa consulta falhar, o formulário e o
    // simulador continuam funcionando — só não mostra a fila de revisão.
    var openKits = [];
    try {
      var kitsData = await api('/api/kits');
      openKits = ((kitsData && kitsData.kits) || []).filter(function(k) { return k.status === 'sugerido'; });
      for (var oi = 0; oi < openKits.length; oi++) {
        var det = await api('/api/kits/' + openKits[oi].id);
        openKits[oi].items = (det.kit && det.kit.items) || [];
      }
    } catch(e) { openKits = []; }
    var openHtml = '';
    if (openKits.length) {
      openHtml = '<div class="panel" style="margin-bottom:20px;border:2px solid var(--ac)"><div class="st" style="margin-top:0">⏳ Kits em aberto para revisar antes de aprovar (' + openKits.length + ')</div>' +
        '<div style="font-size:12px;color:var(--t2);margin-bottom:12px">Ajusta a composição aqui. Ao aprovar, o kit passa a aparecer na aba 📦 Kits para entregar e fechar.</div>';
      openKits.forEach(function(k) {
        openHtml += '<div style="background:var(--p2);border:1px solid var(--bds);border-radius:var(--r2);padding:14px;margin-bottom:12px">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">' +
          '<strong>Kit #' + k.id + ' — ' + esc(k.reseller_name || '') + ' (' + (k.items || []).length + ' itens)</strong>' +
          '<span><button class="btn-sm" onclick="approveKit(' + k.id + ')">✅ Aprovar kit</button> ' +
          '<button class="btn-sm" onclick="kitAction(' + k.id + ',\'reject\')">✕ Rejeitar</button> ' +
          '<button class="btn-sm" onclick="addItemToKit(' + k.id + ')">+ Adicionar produto</button></span></div>';
        (k.items || []).forEach(function(it) {
          openHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px">' +
            '<span>' + esc(it.product_name) + '</span>' +
            '<span style="display:flex;align-items:center;gap:8px"><strong>' + it.quantity_suggested + ' un</strong>' +
            '<button class="btn-sm" onclick="removeItemFromOrdersKit(' + k.id + ',' + it.product_id + ')">− remover</button></span></div>';
        });
        openHtml += '</div>';
      });
      openHtml += '</div>';
    }
    
    var suggestHtml = '<div class="panel" style="margin-bottom:20px"><div class="st" style="margin-top:0">📦 Criar Novo Kit para Revendedora</div>' +
      '<div style="margin-bottom:12px"><label style="font-size:12px;color:var(--t2)">1. Selecione a Revendedora:</label>' +
      '<select id="kitRes" style="width:100%;margin-top:4px">' + resData.resellers.map(function(r){return '<option value="'+r.id+'">'+esc(r.name)+'</option>';}).join('') + '</select></div>' +
      '<div style="margin-bottom:12px"><label style="font-size:12px;color:var(--t2)">2. Adicione produtos ao kit (pode adicionar quantos quiser):</label>' +
      '<div class="row" style="gap:8px;margin-top:4px">' +
      '<select id="kitProd" style="flex:1">' + prodData.products.filter(function(p){return p.available_balance > 0;}).sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(p){return '<option value="'+p.id+'" data-price="'+(p.ideal_price_cents || 0)+'">'+esc(p.name)+' ('+p.available_balance+' disp.)</option>';}).join('') + '</select>' +
      '<input id="kitQty" type="number" min="1" placeholder="qtd" style="width:80px" value="1" />' +
      '<button class="btn-s" onclick="addToKit()">+ Adicionar ao Kit</button>' +
      '</div></div>' +
      '<div id="kitItemsList" style="margin-bottom:12px"></div>' +
      '<div style="display:flex;gap:8px">' +
      '<button class="btn-s" onclick="suggestKit()" style="flex:1;background:var(--sc);color:var(--bg)">✅ Criar Kit</button>' +
      '<button class="btn-s" onclick="clearKit()" style="flex:0.5">🗑️ Limpar</button>' +
      '</div>' +
      '</div>';

    var planHtml = '<div class="panel" style="margin-bottom:20px"><div class="st" style="margin-top:0">🪄 Simular os kits (estoque primeiro, compra depois)</div>' +
      '<div style="font-size:12px;color:var(--t2);margin-bottom:10px">Monta o plano de cada revendedora ativa com o que <em>já está no armazém</em> e joga para uma lista à parte o que <em>precisa comprar</em>. ' +
      'Regra: o que ela pediu + o que ela vendeu no kit em aberto, sem repetir o que ela ainda tem parado na bolsa. Nada é reservado nem baixado aqui.</div>' +
      '<label style="font-size:12px;color:var(--t2)"><input type="checkbox" id="planFill" checked /> completar o kit com o que cada uma mais vende</label> ' +
      '<button class="btn-s" onclick="simularKits()">Gerar plano</button>' +
      '<div id="planOut" style="margin-top:12px"></div></div>';

    v.innerHTML = openHtml + planHtml + suggestHtml;

var kitItems = [];

function addToKit() {
  var prodSelect = $('#kitProd');
  var qty = Number($('#kitQty').value);
  if (!qty || qty < 1) return toast('Informe a quantidade.');
  
  var productId = Number(prodSelect.value);
  var productName = prodSelect.options[prodSelect.selectedIndex].text.split(' (disp.')[0];
  var price = Number(prodSelect.options[prodSelect.selectedIndex].getAttribute('data-price'));
  
  // Verificar se já existe
  var existing = kitItems.find(i => i.product_id === productId);
  if (existing) {
    existing.quantity += qty;
  } else {
    kitItems.push({ product_id: productId, product_name: productName, quantity: qty, price: price });
  }
  
  renderKitItemsList();
  $('#kitQty').value = '1';
}

function removeFromKit(index) {
  kitItems.splice(index, 1);
  renderKitItemsList();
}

// Limite de kit da CEO: valor de venda máximo por kit (R$ 300,00)
var KIT_LIMIT_REAIS = 300;

function renderKitItemsList() {
  var container = $('#kitItemsList');
  if (!container) return;
  
  if (kitItems.length === 0) {
    container.innerHTML = '<div style="color:var(--t3);font-size:12px;text-align:center;padding:8px">Nenhum produto adicionado</div>';
    return;
  }
  
  var total = kitItems.reduce((sum, i) => sum + (i.quantity * i.price / 100), 0);
  var html = '<div style="border:1px solid var(--bds);border-radius:8px;padding:12px;background:var(--p2)">';
  html += '<div style="font-size:12px;color:var(--t2);margin-bottom:8px"><strong>Produtos no kit (' + kitItems.length + '):</strong></div>';
  
  kitItems.forEach(function(item, index) {
    var itemTotal = item.quantity * item.price / 100;
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)">';
    html += '<div style="flex:1;font-size:13px">' + esc(item.product_name) + ' <span style="color:var(--t3)">x' + item.quantity + '</span></div>';
    html += '<div style="font-size:12px;color:var(--t2);margin-right:8px">R$ ' + itemTotal.toFixed(2) + '</div>';
    html += '<button onclick="removeFromKit(' + index + ')" style="background:none;border:none;color:var(--dg);cursor:pointer;font-size:16px">×</button>';
    html += '</div>';
  });
  
  // Cartão do VALOR DE VENDA DO KIT, bem visível
  var overLimit = total > KIT_LIMIT_REAIS;
  var remaining = KIT_LIMIT_REAIS - total;
  var totalColor = overLimit ? '#ff6b6b' : '#4ade80';
  var statusText = '';
  if (overLimit) {
    statusText = '⚠️ Passou do limite de R$ ' + KIT_LIMIT_REAIS.toFixed(2) + ' em R$ ' + Math.abs(remaining).toFixed(2);
  } else if (remaining <= 50) {
    statusText = '⏳ Faltam R$ ' + remaining.toFixed(2) + ' para o limite de R$ ' + KIT_LIMIT_REAIS.toFixed(2);
  } else {
    statusText = '✅ Dentro do limite de R$ ' + KIT_LIMIT_REAIS.toFixed(2);
  }
  
  html += '<div style="margin-top:12px;padding:12px;border-radius:8px;background:var(--p3);border:1px solid ' + (overLimit ? '#ff6b6b' : 'rgba(74,222,128,.3)') + ';text-align:center">';
  html += '<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3)">Valor de venda do kit</div>';
  html += '<div style="font-size:30px;font-weight:700;font-family:Playfair Display,serif;color:' + totalColor + ';line-height:1.1">R$ ' + total.toFixed(2) + '</div>';
  html += '<div style="font-size:12px;color:var(--t2);margin-top:4px">' + statusText + '</div>';
  html += '</div>';
  html += '</div>';
  container.innerHTML = html;
}


function clearKit() {
  if (kitItems.length === 0) return toast('Kit já está vazio');
  if (!confirm('Tem certeza que deseja limpar todos os produtos do kit?')) return;
  kitItems = [];
  renderKitItemsList();
  toast('Kit limpo com sucesso', 'ok');
}

async function suggestKit() {
  if (kitItems.length === 0) return toast('Adicione pelo menos um produto ao kit.');
  
  var kitTotal = kitItems.reduce(function(s, i) { return s + (i.quantity * i.price / 100); }, 0);
  
  try {
    await api('/api/kits/suggest', {method:'POST', body:JSON.stringify({
      reseller_id: Number($('#kitRes').value),
      items: kitItems.map(i => ({ product_id: i.product_id, quantity: i.quantity }))
    })});
    toast('Kit sugerido! Agora aprove na aba 📦 Kits.', 'ok');
    kitItems = [];
    renderKitBuilder(); // limpa o rascunho na tela; a aba 📦 Kits é redesenhada quando você abre ela
  } catch(e) { toast(e.message); }
}

var KIT_PLAN = null;

  var out = $('#planOut'); if(!out) return;
  out.innerHTML = '<div class="empty">Calculando com o estoque de agora…</div>';
  var fill = ($('#planFill') && $('#planFill').checked) ? '1' : '0';

    KIT_PLAN = await api('/api/admin/kit-plan?fill=' + fill);
    renderPlan();

async function aplicarPlano(rid, btn) {
  var fill = ($('#planFill') && $('#planFill').checked);
  if (btn) btn.disabled = true;
  try {
    var r = await api('/api/admin/kit-plan/apply', { method:'POST', body: JSON.stringify({ reseller_id: rid, include_fill: fill }) });
    toast(r.message, 'ok');
    await renderKitBuilder();
  } catch(e) {
    toast(e.message);
    if (btn) btn.disabled = false;
  }
}

async function copiarLista(rid) {
  var p = (KIT_PLAN.plans||[]).find(function(x){ return x.reseller_id === rid; });
  var linhas = (p ? p.lines : []).filter(function(l){ return l.to_buy > 0; }).map(function(l){ return l.name + ' — comprar ' + l.to_buy + ' un. (' + planMoney(l.purchase_cost_cents) + ')'; });
  if (!linhas.length) return toast('Nada para comprar para ela.');
  var txt = 'Compra para o kit de ' + p.reseller_name + ':\n' + linhas.join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Lista de compra copiada.', 'ok'); }
  catch(e) { prompt('Copie a lista:', txt); }
}

// Os dois painéis de kit vivem em abas diferentes: recarrega a que está na tela, para
// nenhum botão sumir depois do clique nem deixar rascunho velho na outra.
function refreshKitViews() {
  if (document.querySelector('#v-kitmontar.active')) return renderKitBuilder();
  if (document.querySelector('#v-kits.active')) return renderKits();
  return renderKitBuilder();
}

async function kitAction(id, action) {
  try {
    await api('/api/kits/' + id + '/' + action, {method:'POST', body:'{}'});
    toast('Ação realizada!', 'ok');
    refreshKitViews();
  } catch(e) { toast(e.message); }
}

async function finalizeAllReconciliations(kitId) {
  try {
    toast('Finalizando conferências...', 'ok');
    // First confirm all pending sales
    var salesData = await api('/api/kits/' + kitId + '/pending-sales');
    if (salesData.sales) {
      for (var s of salesData.sales) {
        if (s.status === 'informada') {
          await api('/api/kit-sales/' + s.id + '/decide', {method:'POST', body:JSON.stringify({action:'confirm'})});
        }
      }
    }
    // Then finalize all reconciliation items
    var reconData = await api('/api/kits/' + kitId + '/reconciliation');
    if (reconData.items) {
      for (var item of reconData.items) {
        if (!item.finalized) {
          await api('/api/kits/' + kitId + '/reconciliation/' + item.kit_item_id, {
            method:'POST',
            body:JSON.stringify({
              quantity_sold_confirmed: item.quantity_sold_confirmed || 0,
              quantity_returned: item.quantity_returned || 0,
              finalized: true
            })
          });
        }
      }
    }
    toast('Todas as conferências finalizadas! Agora clique em "Aprovar Fechamento".', 'ok');
    renderKits();
  } catch(e) { toast('Erro: ' + e.message); }
}

async function approveClosure(kitId) {
  try {
    await api('/api/kits/' + kitId + '/approve-closure', {method:'POST', body:'{}'});
    toast('Fechamento aprovado com sucesso!', 'ok');
    renderKits();
  } catch(e) { toast('Erro: ' + e.message); }
}

async function toggleKitDetails(kitId) {
  var div = document.getElementById('kit-details-' + kitId);
  if (!div) return;
  if (div.style.display === 'none') {
    div.style.display = 'block';
    div.innerHTML = '<div style="color:var(--t3);font-size:13px">Carregando itens...</div>';
    try {
      var data = await api('/api/kits/' + kitId);
      var kit = data.kit || data;
      var items = kit.items || [];
      var fechado = kit.status === 'encerrado';
      var totalSold = 0, totalReturned = 0, totalWriteOff = 0, unitsReturned = 0, unitsWriteOff = 0;
      var devLabel = fechado ? 'Devolvido' : 'Devolver';
      var html = '<div style="font-size:12px;color:var(--t2);margin-bottom:12px">' + items.length + ' tipos de produtos' + (fechado ? ' · kit encerrado (valores conferidos no fechamento)' : '') + '</div>';
      html += '<table style="width:100%;font-size:12px"><tr><th style="text-align:left">Produto</th><th style="text-align:center">Entregue</th><th style="text-align:center;color:#4ade80">Vendido</th><th style="text-align:center;color:#ffa500">' + devLabel + '</th><th style="text-align:right">Preço</th><th style="text-align:right">Subtotal</th>' + (fechado ? '' : '<th style="text-align:center">Ações</th>') + '</tr>';
      items.forEach(function(item) {
        var sold = fechado ? (item.quantity_confirmed_sold || 0) : (item.quantity_pending_closure || 0) + (item.quantity_confirmed_sold || 0);
        // Em kit encerrado o saldo do item e zerado pelo fechamento; o que nao foi vendido
        // fica em quantity_returned. Ler quantity_available aqui mostrava "nada a devolver".
        var dev = fechado ? (item.quantity_returned || 0) : (item.quantity_available || 0);
        var writeOff = (item.quantity_kept_by_reseller || 0) + (item.quantity_damaged || 0) + (item.quantity_lost || 0);
        var price = (item.unit_sale_price_cents || 0) / 100;
        var subtotal = sold * price;
        totalSold += subtotal;
        totalReturned += dev * price;
        totalWriteOff += writeOff * price;
        unitsReturned += dev;
        unitsWriteOff += writeOff;
        var rowStyle = sold > 0 ? 'background:rgba(74,222,128,.05)' : (dev > 0 ? 'background:rgba(255,165,0,.05)' : '');
        html += '<tr style="' + rowStyle + '">';
        html += '<td style="font-weight:500">' + (item.product_name || '?') + '</td>';
        html += '<td style="text-align:center">' + (item.quantity_delivered || 0) + '</td>';
        html += '<td style="text-align:center;color:#4ade80;font-weight:600">' + sold + '</td>';
        html += '<td style="text-align:center;color:#ffa500;font-weight:600">' + dev + (writeOff > 0 ? '<span style="color:var(--t3);font-weight:400"> + ' + writeOff + ' retido/perda</span>' : '') + '</td>';
        html += '<td style="text-align:right">R$ ' + price.toFixed(2) + '</td>';
        html += '<td style="text-align:right;font-weight:600">R$ ' + subtotal.toFixed(2) + '</td>';
        if (!fechado) html += '<td style="text-align:center"><button onclick="removeItemFromKit(' + kitId + ',' + item.product_id + ')" style="background:#dc2626;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer">🗑️ Estornar</button></td>';
        html += '</tr>';
      });
      html += '</table>';
      var commission = kit.reseller ? kit.reseller.commission_pct : 0.3;
      var commissionValue = totalSold * commission;
      html += '<div style="margin-top:16px;padding:12px;background:var(--p3);border-radius:8px;font-size:13px">';
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Total vendido:</span><b style="color:#4ade80">R$ ' + totalSold.toFixed(2) + '</b></div>';
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Comissão (' + Math.round(commission*100) + '%):</span><b style="color:var(--ac)">R$ ' + commissionValue.toFixed(2) + '</b></div>';
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Valor devido à SexS:</span><b>R$ ' + (totalSold - commissionValue).toFixed(2) + '</b></div>';
      html += '<div style="display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:4px;margin-top:4px"><span>' + (fechado ? 'Devolvidas ao estoque no fechamento:' : 'Itens para devolução:') + '</span><b style="color:#ffa500">' + unitsReturned + ' un (R$ ' + totalReturned.toFixed(2) + ')</b></div>';
      if (fechado && unitsWriteOff > 0) html += '<div style="display:flex;justify-content:space-between;padding-top:4px"><span>Retidas / danificadas / perdidas:</span><b style="color:var(--dg)">' + unitsWriteOff + ' un (R$ ' + totalWriteOff.toFixed(2) + ')</b></div>';
      if (fechado && kit.closure) html += '<div style="display:flex;justify-content:space-between;padding-top:4px;color:var(--t3)"><span>Fechamento registrou devolvidas:</span><b>' + (kit.closure.items_returned_to_stock || 0) + ' un</b></div>';
      html += '</div>';
      div.innerHTML = html;
    } catch(e) {
      div.innerHTML = '<div style="color:var(--dg)">Erro: ' + e.message + '</div>';
    }
  } else {
    div.style.display = 'none';
  }
}

// ===== PEDIDOS DAS REVENDEDORAS =====
async function renderOrders() {
  var v = $('#v-orders'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  
  try {
    // Buscar todas as revendedoras
    var resellersResponse = await api('/api/resellers');
    var resellers = resellersResponse.resellers || [];
    
    // Buscar todos os pedidos pendentes
    var allOrders = [];
    for (var reseller of resellers) {
      var ordersResponse = await api('/api/admin/reseller-orders/' + reseller.id);
      var orders = ordersResponse.orders || [];
      var pendingOrders = orders.filter(function(o) { return o.status === 'pendente'; });
      
      if (pendingOrders.length > 0) {
        allOrders.push({
          reseller: reseller,
          orders: pendingOrders
        });
      }
    }
    
    // Os kits sugeridos (aprovar/ajustar) são tratados na aba 🪄 Montar Kit.
    var kitsResponse = await api('/api/kits');
    var kits = kitsResponse.kits || [];
    var openKits = kits.filter(function(k) { return k.status === 'sugerido'; });
    
    var html = '<div class="panel"><div class="st" style="margin-top:0">📋 Gerenciar Pedidos</div>';
    
    if (openKits.length > 0) {
      html += '<div style="margin-bottom:20px;padding:14px 16px;border:2px solid var(--ac);border-radius:var(--r2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<div><strong style="color:var(--ac)">' + openKits.length + ' kit(s) sugerido(s) esperando revisão</strong>' +
        '<div style="font-size:12px;color:var(--t2)">Aprovar, tirar ou acrescentar produto é na aba 🪄 Montar Kit.</div></div>' +
        '<button class="btn-s" onclick="switchTab(\'kitmontar\')">🪄 Abrir Montar Kit</button></div>';
    }

    // Mostrar pedidos por revendedora
    if (allOrders.length > 0) {
      html += '<div style="font-weight:600;margin-bottom:12px">Pedidos Pendentes por Revendedora</div>';
      
      for (var item of allOrders) {
        var reseller = item.reseller;
        var orders = item.orders;
        
        html += '<div style="background:var(--p2);padding:16px;border-radius:var(--r2);border:1px solid var(--bd);margin-bottom:16px">';
        html += '<div style="font-weight:600;margin-bottom:12px">' + esc(reseller.name) + ' (' + orders.length + ' pedidos)</div>';
        
        for (var order of orders) {
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)">';
          html += '<div>';
          html += '<div style="font-weight:500">' + esc(order.product_name) + '</div>';
          html += '<div style="font-size:12px;color:var(--t3)">Qtd: ' + order.quantity_requested + '</div>';
          html += '</div>';
          html += '<button class="btn-sm" onclick="openSeparateModal(' + order.id + ', ' + order.quantity_requested + ', \'' + esc(order.product_name).replace(/'/g, "\\'") + '\')">Separar</button>';
          html += '</div>';
        }
        
        html += '</div>';
      }
    } else {
      html += '<div class="empty">Nenhum pedido pendente no momento.</div>';
    }
    
    html += '</div>';
    
    // Modal de separação
    html += '<div id="separateModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center">';
    html += '<div style="background:var(--p1);padding:24px;border-radius:var(--r2);max-width:400px;width:90%">';
    html += '<div style="font-weight:600;margin-bottom:16px">Separar Pedido</div>';
    html += '<div id="modalProductName" style="margin-bottom:12px"></div>';
    html += '<div style="margin-bottom:16px">';
    html += '<label style="display:block;margin-bottom:6px">Quantidade a separar:</label>';
    html += '<input type="number" id="modalQuantity" min="1" style="width:100%" />';
    html += '</div>';
    html += '<div style="display:flex;gap:10px">';
    html += '<button class="btn-s" onclick="confirmSeparate()" style="flex:1">Confirmar</button>';
    html += '<button class="btn-sm" onclick="closeSeparateModal()" style="flex:1">Cancelar</button>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
    
    v.innerHTML = html;
  } catch(e) {
    v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>';
  }
}

  document.getElementById('modalQuantity').max = quantity;

async function confirmSeparate() {

    closeSeparateModal();
    renderOrders();

    modal.innerHTML = '<h2 style="font-family:Playfair Display,serif;font-size:20px;margin-bottom:20px;color:var(--ac)">Adicionar Produto ao Kit</h2>' +
      '<div class="ig" style="margin-bottom:16px">' +
        '<label style="display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:6px;font-weight:500">Produto</label>' +

          '<option value="">-- Selecione um produto --</option>' +
          products.map(function(p) {
            var stock = p.available_stock != null ? ' (estoque: ' + p.available_stock + ')' : '';
            return '<option value="' + p.id + '">' + esc(p.name) + stock + '</option>';

        '<input id="addItemQuantity" type="number" min="1" value="1" style="width:100%;background:var(--p2);border:1px solid var(--bds);color:var(--t1);border-radius:var(--r1);padding:12px 16px;font-size:14px;font-family:inherit;outline:none" />' +
      '</div>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end">' +
        '<button id="addItemCancel" style="background:var(--p2);color:var(--t1);border:1px solid var(--bds);border-radius:var(--r1);padding:10px 24px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit">Cancelar</button>' +
        '<button id="addItemConfirm" style="background:var(--ag);color:var(--bg);border:none;border-radius:var(--r1);padding:10px 24px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit">Adicionar</button>' +
      '</div>';
    
    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    // Focar no select
    var selectEl = modal.querySelector('#addItemProduct');
    var qtyEl = modal.querySelector('#addItemQuantity');
    selectEl.focus();

    // Fechar modal
    function closeModal() { overlay.remove(); }

    modal.querySelector('#addItemCancel').onclick = closeModal;
    overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });

    // Confirmar
    modal.querySelector('#addItemConfirm').onclick = async function() {
      var productId = parseInt(selectEl.value);
      var quantity = parseInt(qtyEl.value);
      
      if (!productId) { toast('Selecione um produto.'); return; }
      if (!quantity || quantity < 1) { toast('Informe uma quantidade válida.'); return; }

      try {
        await api('/api/kits/' + kitId + '/add-item', {
          method: 'POST',
          body: JSON.stringify({
            product_id: productId,
            quantity: quantity
          })

        refreshKitViews();

  }

// ===================== 🗺️ ABRANGÊNCIA — mapa de revendedoras (CEO) =====================
// A leitura que a CEO pediu: onde eu tenho base, onde estou forte (círculos se
// tocando), onde estou isolada. Raio do círculo é SLIDER — a régua é dela, não nossa.
// Cor do pino = giro dos últimos 30 dias (confirmada + informada). Inativas aparecem
// em cinza pontilhado e nunca contam para força/bairro.
// O mapa usa Leaflet + tiles do OpenStreetMap (CDN público, sem chave). Sem internet
// (ou CDN bloqueada), o painel de bairros continua funcionando e o quadro avisa.

var COV = { dados: null, mapa: null, camada: null, raio: 1.5, showInativas: true, marcando: null, ocupado: false, lida: false };

function covBrl(c) { return 'R$ ' + ((c || 0) / 100).toFixed(2); }

function covDistKm(a, b) {
  var R = 6371, rad = Math.PI / 180;
  var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

function covLoadLeaflet(cb) {
  if (window.L) return cb(true);
  if (COV.leafletTentado) return cb(!!window.L);
  COV.leafletTentado = true;
  // Leaflet 1.9.4 servido LOCAL (vendor/) — a CSP da própria página só permite script de 'self'/jsdelivr,
  // e o unpkg dava block (o "403" que a CEO viu). Assim funciona offline-de-CDN e sem dependência externa.
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = '/vendor/leaflet/leaflet.css';
  var sc = document.createElement('script');
  sc.src = '/vendor/leaflet/leaflet.js';
  sc.onload = function () { cb(true); };
  sc.onerror = function () { cb(false); };

  document.head.appendChild(sc);
}

function covEstilo(r) {
  if (r.status !== 'ativa') return { cor: '#9ca3af', texto: 'inativa', trace: '5,5' };
  if (r.cents_30d >= 10000) return { cor: '#16a34a', texto: 'girando forte (≥R$100/30d)', trace: null };
  if (r.cents_30d > 0) return { cor: '#f59e0b', texto: 'vendendo pouco', trace: null };
  return { cor: '#64748b', texto: 'sem venda lançada há 30 dias', trace: null };
}

async function covRecarregar() {
  try { COV.dados = await api('/api/admin/coverage'); } catch (e) { return toast('Erro: ' + e.message); }
  renderCoverage();
}

function covBuildMap() {
  var el = document.getElementById('cov-map'); if (!el || !window.L) return;
  if (COV.mapa) { COV.mapa.remove(); COV.mapa = null; }
  var pos = COV.dados.resellers.filter(function (r) { return r.lat != null && r.lng != null; });
  var center = pos.length
    ? [pos.reduce(function (s, r) { return s + r.lat; }, 0) / pos.length, pos.reduce(function (s, r) { return s + r.lng; }, 0) / pos.length]
    : [-21.1278, -47.9912]; // Sertãozinho-SP: a cidade da SexS, centro de partida
  COV.mapa = L.map('cov-map', { scrollWheelZoom: true }).setView(center, pos.length ? 13 : 11);
  // Tiles vêm do NOSSO servidor (/maptile) — o navegador não fala com CDN nenhum:
  // nem o OSM (que bloqueia domínio compartilhado: o 403), nem os que pedem API
  // key (o erro seguinte). O servidor tenta os fornecedores em fila, com UA
  // honesto, e cacheia. Caiu tudo? Pinos, círculos e a tabela seguem funcionando.
  L.tileLayer('/maptile/{z}/{x}/{y}.png', {
    maxZoom: 17, attribution: '© OpenStreetMap · © CARTO'
  }).addTo(COV.mapa);
  COV.camada = L.layerGroup().addTo(COV.mapa);
  COV.mapa.on('click', function (e) {
    if (!COV.marcando) return;
    var rid = COV.marcando; COV.marcando = null;
    covSalvar(rid, { lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6), geo_source: 'manual' },
      'Pino salvo — arrastei onde a CEO mandou ✓');
  });
  covDraw();
}

function covDraw() {
  if (!COV.mapa || !COV.camada) return;
  COV.camada.clearLayers();
  var L2 = window.L, rs = COV.dados.resellers;
  var marc = [];
  rs.forEach(function (r) {
    if (r.lat == null || r.lng == null) return;
    if (r.status !== 'ativa' && !COV.showInativas) return;
    marc.push(r);
    var est = covEstilo(r);
    var vizinhos = rs.filter(function (o) {
      return o.id !== r.id && o.status === 'ativa' && r.status === 'ativa' && o.lat != null &&
             covDistKm(r, o) <= COV.raio * 2;
    }).length;
    var forte = r.status === 'ativa' && vizinhos >= 1;
    L2.circle([r.lat, r.lng], {
      radius: COV.raio * 1000, color: est.cor, weight: forte ? 3 : 1.5,
      dashArray: est.trace || null, fillColor: est.cor, fillOpacity: r.status === 'ativa' ? 0.13 : 0.05
    }).addTo(COV.camada);
    var m = L2.marker([r.lat, r.lng], {
      icon: L2.divIcon({
        className: '',
        iconSize: [14, 14], iconAnchor: [7, 7],
        html: '<div style="width:14px;height:14px;border-radius:50%;background:' + est.cor +
              ';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>'
      })
    }).addTo(COV.camada);
    m.bindTooltip((forte ? '💪 ' : '') + r.name + ' · ' + covBrl(r.cents_30d) + '/30d', { direction: 'top' });
    m.bindPopup(covPopupHtml(r), { maxWidth: 320, className: 'cov-pop' });
  });
  if (marc.length) {
    try { COV.mapa.fitBounds(L2.latLngBounds(marc.map(function (r) { return [r.lat, r.lng]; })), { padding: [40, 40], maxZoom: 15 }); } catch (e) {}
  }
  COV.mapa.off('popupopen', covWirePopup); COV.mapa.on('popupopen', covWirePopup);
}

function covPopupHtml(r) {
  var est = covEstilo(r);
  return '<div style="font-size:12px;min-width:250px">' +
    '<b style="font-size:14px">' + esc(r.name) + '</b> <span style="color:' + est.cor + '">●</span> ' + esc(est.texto) +
    (r.bairro ? '<div style="color:var(--t2)">📍 ' + esc(r.bairro) + '</div>' : '') +
    '<div style="color:var(--t3);font-size:11px;margin:2px 0 8px">' + esc(r.address || 'endereço não cadastrado') + '</div>' +
    '<div style="margin:4px 0"><input id="cov-p-addr" value="' + esc(r.address || '') + '" placeholder="endereço completo" style="width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--t1)"></div>' +
    '<div style="display:flex;gap:6px;margin-bottom:8px">' +
      '<input id="cov-p-bairro" value="' + esc(r.bairro || '') + '" placeholder="bairro" style="flex:1;box-sizing:border-box;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--t1)">' +
      '<input id="cov-p-cep" placeholder="CEP" style="width:86px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--p2);color:var(--t1)">' +
    '</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
      '<button class="btn-s" onclick="covLocalizar(' + r.id + ')">🔎 Localizar</button>' +
      '<button class="btn-s" onclick="covMarcar(' + r.id + ')">🖐 posicionar no mapa</button>' +
      '<button class="btn-s" onclick="covSalvar(' + r.id + ', {address:document.getElementById(\'cov-p-addr\').value, bairro:document.getElementById(\'cov-p-bairro\').value})">💾 dados</button>' +
      (r.lat != null ? '<button class="btn-s" onclick="covSalvar(' + r.id + ', {lat:null,lng:null})" title="tira o pino (mantém cadastro)">🧹 limpar pino</button>' : '') +
    '</div>' +
    '<div id="cov-p-msg" style="font-size:11px;color:var(--t3);margin-top:6px">' +
      (r.geo_source ? 'pino por ' + esc(r.geo_source) + ' em ' + esc(String(r.geo_at || '').slice(0, 16)) : 'ainda sem pino') + '</div>' +
    '</div>';
}

}

function covGroups() {
  var ativos = COV.dados.resellers.filter(function (r) { return r.status === 'ativa'; });
  var porBairro = {};
  ativos.forEach(function (r) {
    var b = r.bairro || '(bairro não identificado)';
    (porBairro[b] = porBairro[b] || { bairro: b, girls: [], cents: 0 }).girls.push(r);
    porBairro[b].cents += r.cents_30d || 0;
  });
  var arr = Object.keys(porBairro).map(function (k) {
    var g = porBairro[k];
    var isolada = g.girls.length === 1 && g.girls[0].lat != null && !ativos.some(function (o) {
      return o.id !== g.girls[0].id && o.lat != null && covDistKm(g.girls[0], o) <= COV.raio * 2;
    });
    var semGiro = g.girls.length && g.cents === 0;
    var status = g.girls.length >= 2 ? '💪 zona forte' : (semGiro ? '😴 sem giro' : (isolada ? '🏝️ isolada' : 'ok'));
    return { bairro: g.bairro, n: g.girls.length, cents: g.cents, status: status, nomes: g.girls.map(function (x) { return x.name.split(' ')[0]; }) };
  });
  arr.sort(function (a, b) { return b.cents - a.cents; });
  return arr;
}
