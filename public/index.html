  document.body.appendChild(overlay);
  SI_IN = overlay;

  var elProd = modal.querySelector('#si-prod'), elQty = modal.querySelector('#si-qty'), elCost = modal.querySelector('#si-cost');
  var elInfo = modal.querySelector('#si-info'), elTotal = modal.querySelector('#si-total'), elNew = modal.querySelector('#si-new');
  var elReW = modal.querySelector('#si-reprice-wrap'), elRe = modal.querySelector('#si-reprice');

  function paint() {
    var p = byName[siNorm(elProd.value)] || null;
    var qty = Math.max(0, parseInt(elQty.value) || 0);
    var cents = Math.round((parseFloat(String(elCost.value||'').replace(',','.')) || 0) * 100);
    if (p) {
      var last = p.last_purchase_cost_cents || 0;
      var delta = cents && last ? cents - last : 0;
      elInfo.innerHTML = '<div style="background:var(--p2);border:1px solid var(--bd);border-radius:var(--r1);padding:10px 12px;font-size:12px;color:var(--t2)">' +
        'Estoque atual: <b>' + (p.available_balance||0) + ' disp.</b>' + ((p.reserved||0) > 0 ? ' · <span style="color:#ffa500">' + p.reserved + ' reservado</span>' : '') +
        ' · Última compra: <b>' + f(last) + '/un</b>' +
        (cents && last && cents !== last ? ' → <b style="color:' + (delta>0?'#f87171':'#4ade80') + '">' + (delta>0?'+':'') + f(Math.abs(delta)) + '/un (' + (delta>0?'+':'') + Math.round(delta*100/last) + '%)</b>' : '') +
        '<div style="color:var(--t3);margin-top:4px">Depois desta entrada: saldo <b>' + ((p.available_balance||0) + qty) + '</b>' + (qty ? ' · soma entra pelo lote novo (média ponderada no fechamento)' : '') + '</div></div>';
      elNew.style.display = 'none';
      var showRe = !!(cents && last && cents !== last);
      elReW.style.display = showRe ? 'flex' : 'none';
      if (showRe) {
        modal.querySelector('#si-newideal').textContent = f(Math.round(cents * 3));
        modal.querySelector('#si-newmin').textContent = f(Math.round(cents / 0.7));
      }
    } else if (String(elProd.value).trim()) {
      elInfo.innerHTML = '<div style="font-size:12px;color:#fbbf24">⚠ Nenhum produto com esse nome exato no catálogo.</div>';
      elNew.style.display = 'block';
      elReW.style.display = 'none';
    } else {
      elInfo.innerHTML = '<div style="font-size:12px;color:var(--t3)">Digite o nome do produto — a lista mostra o custo e o saldo de cada um.</div>';
      elNew.style.display = 'none';
      elReW.style.display = 'none';
    }
    elTotal.innerHTML = (qty && cents) ? 'Total desta compra: <b style="color:var(--t1)">' + f(qty*cents) + '</b> (' + qty + ' × ' + f(cents) + ')' : '';
  }
  [elProd, elQty, elCost].forEach(function(el){ el.addEventListener('input', paint); });
  paint();
  elProd.focus();

  function close() { overlay.remove(); SI_IN = null; document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  modal.querySelector('#si-cancel').onclick = close;
  overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);

  modal.querySelector('#si-ok').onclick = async function() {
    var btn = modal.querySelector('#si-ok');
    var name = String(elProd.value||'').trim().replace(/\s+/g,' ');
    var p = byName[siNorm(name)] || null;
    var qty = parseInt(elQty.value);
    var cents = Math.round((parseFloat(String(elCost.value||'').replace(',','.')) || 0) * 100);
    if (!name) return toast('Informe o produto comprado');
    if (!qty || qty <= 0) return toast('Quantidade deve ser 1 ou mais');
    if (!cents || cents <= 0) return toast('Informe o valor pago por unidade');
    if (!p && btn.dataset.confirm !== '1') {
      // cadastro novo exige um segundo clique — evita criar produto com nome digitado errado
      btn.dataset.confirm = '1';
      btn.textContent = '✅ Cadastrar “' + name + '” e lançar';
      toast('Produto novo — clique de novo para confirmar o cadastro');
      return;
    }
    var item = p ? { product_id: p.id, qty: qty, unit_cost_cents: cents, reprice: elRe.checked }
                 : { name: name, qty: qty, unit_cost_cents: cents, create_if_missing: true,
                     category: modal.querySelector('#si-cat').value,
                     internal_code: String(modal.querySelector('#si-code').value||'').trim() };
    btn.disabled = true;
    try {
      var r = await api('/api/admin/stock-in', { method: 'POST', body: JSON.stringify({
        items: [item], reason: String(modal.querySelector('#si-note').value||'').trim() || 'Compra registrada na aba Estoque' }) });
      var first = (r.results||[])[0];
      if (!first || !first.product_id) throw new Error((first && first.error) || 'não foi possível lançar a entrada');
      close();
      toast('+' + first.qty + ' un de ' + first.name + ' · saldo ' + first.balance_after +
            (first.created ? ' · 🆕 cadastrado' : '') + (first.repriced ? ' · ♻️ preços atualizados' : ''), 'ok');
      renderStock();
    } catch(e) { btn.disabled = false; toast('Erro: ' + e.message); }
  };
}

async function renderStock() {
  var v = $('#v-stock'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    var [prodData, movData] = await Promise.all([api('/api/products'), api('/api/stock-movements')]);
    var f = function(c) { return c ? 'R$ ' + (c/100).toFixed(2) : '—'; };
    
    // Comissões das revendedoras
    var COM30 = 0.30; // Yasmin, Flavia
    var COM25 = 0.25; // Larissa, Taina, Luana, Gizelle
    
    // Calcular preço sugerido: custo ÷ (1 - maior_comissão - margem_desejada)
    // Com 30% comissão e margem de 20%: preço = custo ÷ 0.50 = custo ×2 → muito baixo
    // Usando custo ×3: com 30% comissão, sobra custo×2.1, lucro = custo×1.1 ✓
    // Usando custo ×3: com 25% comissão, sobra custo×2.25, lucro = custo×1.25 ✓
    function calcSalePrice(cost) { return Math.round(cost * 3); }
    function calcProfit(cost, salePct) {
      var sale = calcSalePrice(cost);
      var comm = Math.round(sale * salePct);
      return sale - comm - cost;
    }
    
    // Totais
    var totalCost = 0, totalQty = 0;
    var totalProfit30 = 0, totalProfit25 = 0;
    
    prodData.products.forEach(function(p) {
      var cost = p.last_purchase_cost_cents || 0;
      var avail = p.available_balance || 0;
      var reserved = p.reserved || 0;
      var totalOwned = avail + reserved; // total que a empresa possui
      totalCost += cost * totalOwned;
      totalQty += totalOwned;
      totalProfit30 += calcProfit(cost, COM30) * totalOwned;
      totalProfit25 += calcProfit(cost, COM25) * totalOwned;
    });
    
    // Cards resumo
    var totalReserved = prodData.products.reduce(function(s,p){ return s + (p.reserved||0); }, 0);
    var summaryHtml = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px">' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid var(--bd)">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">💰 Investido no Estoque</div>' +
        '<div style="font-size:22px;font-weight:700;color:var(--t1);margin-top:4px;font-family:Playfair Display,serif">R$ ' + (totalCost/100).toFixed(2) + '</div>' +
      '</div>' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid var(--bd)">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">📦 Itens / Unidades</div>' +
        '<div style="font-size:22px;font-weight:700;color:var(--t1);margin-top:4px;font-family:Playfair Display,serif">' + prodData.products.length + ' / ' + totalQty + '</div>' +
      '</div>' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid ' + (totalReserved > 0 ? 'rgba(255,165,0,.25)' : 'var(--bd)') + '">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">🔒 Reservado</div>' +
        '<div style="font-size:22px;font-weight:700;color:' + (totalReserved > 0 ? '#ffa500' : 'var(--t1)') + ';margin-top:4px;font-family:Playfair Display,serif">' + totalReserved + ' un</div>' +
        '<div style="font-size:10px;color:var(--t3)">com revendedoras</div>' +
      '</div>' +
    '</div>';
    
    // Revendedoras info
    var resellersHtml = '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid var(--bd);margin-bottom:16px">' +
      '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">👩‍💼 Revendedoras e Comissões</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<span style="background:var(--acs);color:#ffa500;padding:4px 12px;border-radius:20px;font-size:12px"><b>Yasmin</b> 30%</span>' +
        '<span style="background:var(--acs);color:#ffa500;padding:4px 12px;border-radius:20px;font-size:12px"><b>Flavia</b> 30%</span>' +
        '<span style="background:var(--acs);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:12px"><b>Larissa</b> 25%</span>' +
        '<span style="background:var(--acs);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:12px"><b>Taina</b> 25%</span>' +
        '<span style="background:var(--acs);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:12px"><b>Luana</b> 25%</span>' +
        '<span style="background:var(--acs);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:12px"><b>Gizelle</b> 25%</span>' +
      '</div>' +
    '</div>';
    
    // Legenda
    var legendHtml = '<div style="margin-bottom:12px;font-size:11px;color:var(--t3);line-height:1.8">' +
      '<b>Disponível</b> = estoque livre no armazém · ' +
      '<b style="color:#ffa500">Reservado</b> = itens com revendedoras (em kits ativos, só dá baixa após fechamento) · ' +
      '<b>Compra</b> = valor pago (nota fiscal) · ' +
      '<b style="color:var(--ac)">Venda Sugerida</b> = preço mínimo sem prejuízo (custo ×3) · ' +
      '<b style="color:#ffa500">Lucro/un 30%</b> = Yasmin/Flavia · ' +
      '<b style="color:#4ade80">Lucro/un 25%</b> = Larissa/Taina/Luana/Gizelle (por unidade)' +
      (totalReserved > 0 ? '<br>⚠️ <b style="color:#ffa500">' + totalReserved + ' itens reservados</b> com revendedoras — só dar baixa após fechamento do kit.' : '') +
    '</div>';
    
    // Tabela de produtos agrupados por categoria
    var categories = {};
    prodData.products.forEach(function(p) {
      var cat = p.category || 'Outros';
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(p);
    });
    
    var tableHtml = '';
    Object.keys(categories).sort().forEach(function(cat) {
      var items = categories[cat];
      tableHtml += '<tr style="background:var(--p3)"><td colspan="7" style="padding:10px 14px;font-weight:700;color:var(--ac);font-size:11px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--ac)">' + esc(cat) + ' <span style="color:var(--t3);font-weight:400">(' + items.length + ' produtos)</span></td></tr>';
      
      items.forEach(function(p) {
        var cost = p.last_purchase_cost_cents || 0;
        var sale = calcSalePrice(cost);
        var avail = p.available_balance || 0;
        var reserved = p.reserved || 0;
        var totalOwned = avail + reserved;
        var physical = p.physical_balance || 0;
        var comm30 = Math.round(sale * COM30);
        var comm25 = Math.round(sale * COM25);
        var profit30 = sale - comm30 - cost;
        var profit25 = sale - comm25 - cost;
        var lowStock = avail <= (p.low_stock_threshold || 2);
        
        tableHtml += '<tr' + (lowStock && reserved === 0 ? ' style="background:rgba(212,113,122,.08)"' : '') + '>' +
          '<td style="font-weight:500;font-size:13px">' + esc(p.name) + (lowStock && reserved === 0 ? ' <span style="color:var(--dg);font-size:10px">⚠ baixo</span>' : '') +
          ' <a href="javascript:void 0" onclick="openStockInModal(' + p.id + ')" title="Registrar compra deste produto" style="color:var(--t3);font-size:12px;text-decoration:none">🛒</a></td>' +
          '<td style="text-align:center;font-weight:700;font-size:14px">' + avail + '</td>' +
          '<td style="text-align:center;color:' + (reserved > 0 ? '#ffa500' : 'var(--t3)') + ';font-weight:' + (reserved > 0 ? '600' : '400') + '">' + (reserved > 0 ? reserved : '—') + '</td>' +

      summaryHtml + resellersHtml + legendHtml +
      '<div style="overflow-x:auto"><table style="width:100%;font-size:13px">' +
      '<tr>' +
        '<th style="text-align:left">Produto</th>' +
        '<th style="text-align:center">Disponível</th>' +
        '<th style="text-align:center;color:#ffa500">Reservado</th>' +
        '<th style="text-align:center">✏️ Editar</th>' +
        '<th style="text-align:right">💰 Compra</th>' +
        '<th style="text-align:right;color:var(--ac)">🏷️ Venda Sugerida</th>' +
        '<th style="text-align:right">📈 Lucro/un<br><span style="font-size:8px;font-weight:400;text-transform:none">🟠 30% · 🟢 25%</span></th>' +
        '<th style="text-align:right">💵 Lucro Total<br><span style="font-size:8px;font-weight:400;text-transform:none">🟠 30% · 🟢 25%</span></th>' +
      '</tr>' +
      tableHtml + '</table></div></div>' +

// ===== CEO: KITS DETALHADO (produtos com cada revendedora) =====

var stockEditMode = false;
var stockChanges = {};

function toggleStockEditMode() {
  stockEditMode = !stockEditMode;
  var saveBtn = document.getElementById('saveStockBtn');
  var cancelBtn = document.getElementById('cancelStockBtn');
  var editInputs = document.querySelectorAll('.stock-edit-input');
  
  if (stockEditMode) {
    saveBtn.style.display = 'inline-block';
    cancelBtn.style.display = 'inline-block';
    editInputs.forEach(function(input) { input.style.display = 'inline-block'; });
    toast('Modo de edição ativado', 'ok');
  } else {
    saveBtn.style.display = 'none';
    cancelBtn.style.display = 'none';
    editInputs.forEach(function(input) { input.style.display = 'none'; });
    stockChanges = {};
    toast('Modo de edição desativado');
  }
}

function updateStockChange(productId, newQuantity) {
  stockChanges[productId] = parseInt(newQuantity);
}

function cancelStockEdit() {
  stockEditMode = false;
  stockChanges = {};
  var saveBtn = document.getElementById('saveStockBtn');
  var cancelBtn = document.getElementById('cancelStockBtn');
  var editInputs = document.querySelectorAll('.stock-edit-input');
  
  saveBtn.style.display = 'none';
  cancelBtn.style.display = 'none';
  editInputs.forEach(function(input) { 
    input.style.display = 'none';
    input.value = input.getAttribute('data-original');
  });
  
  toast('Edição cancelada');
}

async function saveStockChanges() {
  if (Object.keys(stockChanges).length === 0) {
    toast('Nenhuma alteração para salvar');
    return;
  }
  
  var updates = Object.keys(stockChanges).map(function(productId) {
    return {
      product_id: parseInt(productId),
      new_quantity: stockChanges[productId],
      reason: 'Ajuste manual de estoque'
    };
  });
  
  try {
    var response = await api('/api/admin/update-stock-quantities', {
      method: 'POST',
      body: JSON.stringify({ updates: updates })
    });
    
    if (response.results) {
      var successCount = response.results.filter(function(r) { return r.success; }).length;
      toast(successCount + ' produtos atualizados com sucesso!', 'ok');
      
      stockEditMode = false;
      stockChanges = {};
      
      setTimeout(function() { renderStock(); }, 1000);
    }
  } catch(e) {
    toast('Erro ao salvar: ' + e.message);
  }
}

async function renderKitDetails() {
  var v = $('#v-kitdetails'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    var data = await api('/api/kits/products-summary');
    var items = data.kit_items || [];
    var f = function(c) { return c ? 'R$ ' + (c/100).toFixed(2) : '—'; };

    // Agrupar por revendedora
    var byReseller = {};
    items.forEach(function(item) {
      var key = item.reseller_name;
      if (!byReseller[key]) byReseller[key] = [];
      byReseller[key].push(item);
    });

    var html = '';
    Object.keys(byReseller).sort().forEach(function(name) {
      var resellerItems = byReseller[name];
      var totalValue = resellerItems.reduce(function(s,i){ return s + (i.unit_sale_price_cents||0) * (i.quantity_delivered||0); }, 0);
      var totalQty = resellerItems.reduce(function(s,i){ return s + (i.quantity_delivered||0); }, 0);
      var totalSold = resellerItems.reduce(function(s,i){ return s + (i.quantity_confirmed_sold||0); }, 0);

      html += '<div class="panel" style="margin-bottom:16px"><div class="st" style="margin-top:0">👩‍💼 ' + esc(name) + '</div>' +
        '<div style="font-size:12px;color:var(--t2);margin-bottom:10px">' + totalQty + ' itens · ' + totalSold + ' vendidos · Valor: ' + f(totalValue) + '</div>' +
        '<table style="width:100%;font-size:13px">' +
        '<tr><th>Produto</th><th style="text-align:center">Entregue</th><th style="text-align:center">Vendido</th><th style="text-align:center">Restante</th><th style="text-align:right">Preço</th></tr>';
      resellerItems.forEach(function(i) {
        var remaining = (i.quantity_delivered||0) - (i.quantity_confirmed_sold||0) - (i.quantity_returned||0);
        html += '<tr><td>' + esc(i.product_name) + '</td>' +
          '<td style="text-align:center">' + (i.quantity_delivered||0) + '</td>' +
          '<td style="text-align:center;color:#4ade80;font-weight:600">' + (i.quantity_confirmed_sold||0) + '</td>' +
          '<td style="text-align:center;color:' + (remaining > 0 ? '#ffa500' : 'var(--t3)') + '">' + remaining + '</td>' +
          '<td style="text-align:right">' + f(i.unit_sale_price_cents) + '</td></tr>';
      });
      html += '</table></div>';
    });

    if (!html) html = '<div class="panel"><div class="empty">Nenhum kit ativo com revendedoras.</div></div>';
    v.innerHTML = html;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>'; }
}

async function renderResellerMessages() {
  var v = $('#v-resellerMsgs'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    var data = await api('/api/reseller-messages');
    var msgs = data.messages || [];
    var unread = data.unread || 0;

    var html = '<div class="panel"><div class="st" style="margin-top:0">💬 Recados das Revendedoras' + (unread > 0 ? ' <span style="background:var(--dg);color:var(--bg);padding:2px 8px;border-radius:10px;font-size:11px">' + unread + ' novo(s)</span>' : '') + '</div>';

    if (msgs.length === 0) {
      html += '<div class="empty">Nenhum recado recebido.</div>';
    } else {
      msgs.forEach(function(m) {
        var isUnread = !m.read_at;
        html += '<div class="il" style="flex-direction:column;align-items:flex-start;gap:4px;' + (isUnread ? 'background:var(--acs);padding:10px;border-radius:var(--r1);margin-bottom:4px' : '') + '">' +
          '<div style="display:flex;justify-content:space-between;width:100%;align-items:center">' +
            '<div><b style="color:var(--ac)">' + esc(m.reseller_name) + '</b> <span style="font-size:11px;color:var(--t3)">' + esc(m.created_at) + '</span></div>' +
            (isUnread ? '<button class="btn-sm" onclick="markMsgRead(' + m.id + ')">✓ Marcar lido</button>' : '<span style="color:#4ade80;font-size:10px">✓ lido</span>') +
          '</div>' +
          '<div style="font-size:14px">' + esc(m.message) + '</div>' +
        '</div>';
      });
    }
    html += '</div>';
    v.innerHTML = html;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>'; }
}

async function markMsgRead(id) {
  try {

async function renderPortalOrders() {
  var v = $('#portal-orders'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    var ordersData = await api('/api/portal/orders', {token: S.token});
    
    var statusLabels = {pendente: '⏳ Pendente', atendido: '✅ Atendido', separado: '📦 Separado', cancelado: '❌ Cancelado'};
    var statusColors = {pendente: '#ffa500', atendido: '#4ade80', separado: '#3b82f6', cancelado: '#ff6b6b'};
    
    // Pedidos feitos pelo catálogo são apenas listados aqui.
    var newOrderHtml = '';
    // Lista de pedidos — reduzir poluição visual:
    //  - Pendentes: sempre visíveis
    //  - Atendidos/Separados: visíveis temporariamente por 1 dia (para a revendedora
    //    ver que foi separado/atendido) e depois somem
    var CUTOFF_1DIA = Date.now() - 24 * 60 * 60 * 1000;
    function orderRecente(o) {
      var t = new Date(o.updated_at || o.created_at || '').getTime();
      return !isNaN(t) && t >= CUTOFF_1DIA;
    }
    var visibleOrders = (ordersData.orders || []).filter(function(o) {
      if (o.status === 'pendente') return true;        // pendente sempre aparece
      return orderRecente(o);                          // demais só se recente (24h)
    });
    
    var ordersHtml = '';
    if (visibleOrders.length > 0) {
      var pendCount = visibleOrders.filter(function(o){return o.status==='pendente';}).length;
      ordersHtml = '<div class="panel"><div class="st" style="margin-top:0">Meus Pedidos (' + visibleOrders.length + ')</div>' +
        (pendCount < visibleOrders.length ? '<div style="font-size:11px;color:var(--t3);margin-bottom:8px">Pendentes aparecem sempre. Atendidos/separados somem após 1 dia.</div>' : '') +
        '<table style="width:100%;font-size:13px"><tr><th>Produto</th><th style="text-align:center">Qtd</th><th>Status</th><th>Quando</th><th style="text-align:center">Ações</th></tr>' +
        visibleOrders.map(function(o){
          var actions = '';
          if (o.status === 'pendente') {
            actions = '<button class="btn-sm" onclick="editOrder(' + o.id + ', ' + o.quantity_requested + ')" style="margin-right:4px">✏️</button>' +
                      '<button class="btn-sm" onclick="cancelOrder(' + o.id + ')" style="background:#ff6b6b;color:white">🗑️</button>';
          }
          return '<tr><td>'+esc(o.product_name || 'Produto #'+o.product_id)+'</td>' +
            '<td style="text-align:center;font-weight:600">'+o.quantity_requested+'</td>' +
            '<td><span style="color:'+(statusColors[o.status]||'var(--t2)')+'">'+esc(statusLabels[o.status]||o.status)+'</span></td>' +
            '<td style="color:var(--t3);font-size:11px">'+esc(o.created_at || '')+'</td>' +
            '<td style="text-align:center">'+actions+'</td></tr>';
        }).join('') + '</table></div>';
    } else {
      ordersHtml = '<div class="panel"><div class="empty">Nenhum pedido feito ainda. Para pedir produtos, acesse o Catálogo. 🛍️</div></div>';
    }
    
    v.innerHTML = newOrderHtml + ordersHtml;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; }
}

// Balão de cronômetro do ciclo: 30 dias a partir da data de entrega do kit (delivered_at,
// UTC do banco). Verde até 3 dias do fim, âmbar no fim de semana do prazo, vermelho vencido.
// Só leitura — nada aqui cobra fechamento nem muda status.
function portalPrazoChip(kit) {
  if (!kit || !kit.delivered_at || kit.status === 'encerrado' || kit.status === 'cancelado' || kit.status === 'rejeitado') return '';
  var dl = Date.parse(String(kit.delivered_at).replace(' ', 'T') + 'Z');
  if (isNaN(dl)) return '';
  var prazo = dl + 30 * 864e5;
  var dias = Math.ceil((prazo - Date.now()) / 864e5);
  var venc = new Date(prazo).toLocaleDateString('pt-BR');
  var base = 'display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;margin:2px 0 8px;border:1px solid ';
  if (dias > 3) return '<div style="' + base + 'rgba(34,197,94,.45);background:rgba(34,197,94,.10);color:#4ade80">\u23F1\uFE0F fechamento em ' + dias + ' dias \u00b7 renova\u00e7\u00e3o ' + venc + '</div>';
  if (dias >= 0) return '<div style="' + base + 'rgba(245,158,11,.5);background:rgba(245,158,11,.12);color:#fbbf24">\u23F1\uFE0F faltam ' + dias + ' dia' + (dias === 1 ? '' : 's') + ' para o fechamento \u00b7 ' + venc + '</div>';
  return '<div style="' + base + 'rgba(239,68,68,.5);background:rgba(239,68,68,.10);color:#f87171">\u23F0 prazo de fechamento venceu h\u00e1 ' + (-dias) + ' dia' + ((-dias) === 1 ? '' : 's') + ' \u2014 acerte com a CEO</div>';
}

async function renderPortalKits() {
  var v = $('#portal-kits'); if(!v) return;
  try {
    var data = await api('/api/portal/kits', {token: S.token});
    var reminderHtml = data.settlement_reminder ? '<div class="panel" style="border:2px solid #f59e0b;background:rgba(245,158,11,.10);color:#fbbf24;margin-bottom:14px"><b>🔔 Lembrete de acerto</b><br>'+esc(data.settlement_reminder)+'</div>' : '';
    if (!data.kits || !data.kits.length) {
      v.innerHTML = reminderHtml + '<div class="panel"><div class="empty">Nenhum kit disponível ainda.</div></div>';
      return;
    }
    
    // Filtrar apenas kits ativos (não encerrados)
    var activeKits = data.kits.filter(function(k) { return k.status !== 'encerrado'; });
    
    if (!activeKits.length) {
      v.innerHTML = reminderHtml + '<div class="panel"><div class="empty">Seu kit anterior foi encerrado. Aguarde o próximo kit! 📦</div></div>';
      return;
    }
    
    // Filtrar apenas kits entregues ou aguardando fechamento (prontos para venda)
    var readyKits = activeKits.filter(function(k) { 
      return k.status === 'entregue' || k.status === 'aguardando_fechamento'; 
    });
    
    // Se não tem kits prontos para venda, mostrar status dos kits em preparação
    if (!readyKits.length) {
      var html = '<div class="panel"><div class="st" style="margin-top:0">Status dos Seus Kits</div>';
      
      activeKits.forEach(function(k) {
        var statusMessages = {
          'sugerido': '⏳ Seu kit está sendo preparado pela CEO. Aguarde a aprovação!',
          'aprovado': '✅ Seu kit foi aprovado! Aguarde a entrega.',
          'em_preparacao': '📦 Seu kit está sendo preparado. Aguarde a entrega!'
        };
        
        html += '<div style="background:var(--p2);padding:16px;border-radius:var(--r2);border:1px solid var(--bd);margin-bottom:12px">';
        html += '<div style="font-weight:600;margin-bottom:8px">Kit #' + k.id + '</div>';
        html += '<div style="color:var(--t2)">' + (statusMessages[k.status] || 'Status: ' + k.status) + '</div>';
        html += '</div>';
      });
      
      html += '</div>';
      v.innerHTML = reminderHtml + html;
      return;
    }
    
    // UM CARTÃO POR KIT (ciclo), cada um com seus itens, seu total e SEUS botões.
    // Antes os itens de todos os kits "prontos" eram jogados numa lista única, sem dizer de
    // qual ciclo era o quê, e os botões atuavam em todos os kits de uma vez.
    var html = '';
    for (var k of readyKits) {
      var kit = null;
      try { kit = (await api('/api/portal/kits/'+k.id, {token: S.token})).kit; } catch(e) {}
      if (!kit || !kit.items || !kit.items.length) continue;
      var kitUnits = 0, kitValue = 0;
      kit.items.forEach(function(i){ kitUnits += (i.quantity_available||0); kitValue += (i.unit_sale_price_cents||0)*(i.quantity_available||0); });
      var emConf = kit.status === 'aguardando_fechamento';
      html += '<div class="kit-card" style="margin-bottom:16px">' +
        '<span class="pill">'+esc((kit.status||'').replace(/_/g,' '))+'</span>' +
        '<h3>Ciclo '+(kit.cycle_number!=null?kit.cycle_number:'?')+' · Kit #'+kit.id+'</h3>' +
        portalPrazoChip(kit) +
        '<div style="font-size:12px;color:var(--t3);margin-bottom:10px">'+kit.items.length+' produtos · '+kitUnits+' un em mãos · valor em mãos <b style="color:var(--ac)">R$ '+(kitValue/100).toFixed(2)+'</b></div>' +
        (emConf ? '<div style="font-size:12px;color:#ffa500;margin-bottom:10px">⏳ em conferência com a CEO — você ainda pode lançar venda deste ciclo</div>' : '');
      kit.items.forEach(function(item) {
        // A CEO pediu: item com saldo zero e venda registrada mostra VENDIDO, não "(0 un)".
        // Sem venda registrada (devolvido/perdido/retido) continua mostrando a contagem.
        var vendidas = (item.quantity_confirmed_sold||0) + (item.quantity_pending_closure||0);
        var qtdTag = (item.quantity_available||0) > 0
          ? '<b style="color:var(--ac)">('+item.quantity_available+' un)</b>'
          : (vendidas > 0 ? '<b style="color:#f87171">VENDIDO</b>' : '<b style="color:var(--t3)">('+item.quantity_available+' un)</b>');
        html += '<div class="il"><span>'+esc(item.product_name)+' '+qtdTag+'</span>' +
          '<span><b>R$ '+(item.unit_sale_price_cents/100).toFixed(2)+'</b></span></div>';
      });
      var temOqueVender = kit.items.some(function(i){ return (i.quantity_available||0) > 0; });
      if (temOqueVender) {
        html += '<div class="st" style="font-size:13px;margin:14px 0 6px">Informar venda deste ciclo</div>';
        kit.items.forEach(function(item) {
          if ((item.quantity_available||0) > 0) {
            html += '<div class="row" style="margin-bottom:8px"><span style="flex:1;font-size:13px">'+esc(item.product_name)+'</span>' +
              '<input type="number" min="1" max="'+item.quantity_available+'" placeholder="qtd" style="width:70px" id="sale-'+item.id+'" />' +
              '<button class="btn-sm ok" onclick="informSale('+item.id+')">Vender</button></div>';
          }
        });
      }
      html += '<div style="margin-top:12px;text-align:center">';
      html += emConf
        ? '<button class="btn-s" onclick="reopenKits(['+kit.id+'])">↩️ Reabrir este kit para nova venda</button>'
        : '<button class="btn-s" onclick="requestClosureAll(['+kit.id+'])">📋 Solicitar fechamento deste ciclo</button>';
      html += '</div></div>';
    }
    if (!html) html = '<div class="panel"><div class="empty">Nenhum produto pronto para venda agora.</div></div>';
    v.innerHTML = reminderHtml + html;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; }
}

// ===== PORTAL: MINHAS VENDAS =====
async function renderPortalSales() {
  var v = $('#portal-sales'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    // Buscar dados de vendas
    var salesData = await api('/api/portal/sales', {token: S.token});
    var s = salesData.summary || {};
    var sales = salesData.sales || [];
    S.portalSales = {}; sales.forEach(function(x){ S.portalSales[x.id] = x; });
    
    // Buscar kits da revendedora
    var kitsData = await api('/api/portal/kits', {token: S.token});
    var kits = kitsData.kits || [];
    
    // Buscar histórico de comissões
    var historyData = await api('/api/portal/commission-history', {token: S.token});
    var totalReceived = historyData.total_received_cents || 0;
    var totalPayments = historyData.total_payments || 0;
    
    var f = function(c) { return 'R$ ' + ((c||0)/100).toFixed(2); };
    
    // Separar kits ativos e encerrados
    var activeKits = kits.filter(function(k) { return k.status !== 'encerrado'; });
    var closedKits = kits.filter(function(k) { return k.status === 'encerrado'; });
    
    // Calcular dados apenas do kit ativo — inclui vendas CONFIRMADAS e INFORMAidas
    // (a revendedora vê a comissão atualizando na hora, com aviso de "prevista" até a CEO confirmar)
    var activeSummary = { items_sold: 0, total_sold_cents: 0, confirmed_sold_cents: 0, commission_earned_cents: 0, commission_pct: s.commission_pct || 0, pending_sales: 0 };
    if (activeKits.length > 0) {
      var activeKitIds = activeKits.map(function(k) { return k.id; });
      var activeSales = sales.filter(function(sale) { return activeKitIds.indexOf(sale.kit_id) !== -1; });
      
      activeSales.forEach(function(sale) {
        if (sale.status === 'confirmada' || sale.status === 'informada') {
          activeSummary.items_sold += sale.quantity;
          var total = sale.quantity * (sale.unit_price_cents || 0);
          activeSummary.total_sold_cents += total;
        }
        if (sale.status === 'confirmada') {
          activeSummary.confirmed_sold_cents += sale.quantity * (sale.unit_price_cents || 0);
        }
        if (sale.status === 'informada') {
          activeSummary.pending_sales += 1;
        }
      });
      
      activeSummary.commission_earned_cents = Math.round(activeSummary.total_sold_cents * activeSummary.commission_pct);
    }
    
    var pendingNote = activeSummary.pending_sales > 0
      ? '<div style="font-size:11px;color:#ffa500;margin-top:6px">⏳ ' + activeSummary.pending_sales + ' venda(s) informada(s) aguardando confirmação da CEO</div>'
      : '';
    
    // Cards no topo - apenas kit ativo (atualiza em tempo real com vendas informadas)
    var summaryHtml = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px">' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid var(--bd)">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">📦 Itens Vendidos (Kit Ativo)</div>' +
        '<div style="font-size:22px;font-weight:700;margin-top:4px">' + activeSummary.items_sold + '</div>' +
      '</div>' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid var(--bd)">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">💰 Total Vendido (Kit Ativo)</div>' +
        '<div style="font-size:22px;font-weight:700;color:var(--ac);margin-top:4px">' + f(activeSummary.total_sold_cents) + '</div>' +
      '</div>' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid rgba(148,184,138,.25)">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">🏆 Minha Comissão (Kit Ativo)</div>' +
        '<div style="font-size:22px;font-weight:700;color:#4ade80;margin-top:4px">' + f(activeSummary.commission_earned_cents) + '</div>' +
        (activeSummary.pending_sales > 0 ? '<div style="font-size:10px;color:#ffa500;margin-top:4px">prevista (inclui informadas)</div>' : '') +
      '</div>' +
    '</div>' +
    (pendingNote ? '<div style="margin-bottom:16px">' + pendingNote + '</div>' : '') +
    '<div style="margin-bottom:20px">' +
      (function(){
        // Base oficial = fechamentos (commission_billed/open). O cálculo antigo por venda
        // fica como teto de segurança: se um dia existir venda confirmada fora de
        // fechamento, nada some do card dela — no normal, os dois batem centavo a centavo.
        var ganho = Math.max(s.commission_billed_cents != null ? s.commission_billed_cents : 0, s.commission_earned_cents || 0);
        var aReceber = Math.max(0, s.commission_open_cents != null ? s.commission_open_cents : 0, ganho - totalReceived);
        return '<div style="background:linear-gradient(135deg, #10b981, #059669);padding:20px;border-radius:var(--r2);color:white">' +
          '<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:0.9;margin-bottom:8px">💎 Comissão acumulada (já faturada)</div>' +
          '<div style="font-size:32px;font-weight:700;margin-bottom:4px">' + f(ganho) + '</div>' +
          '<div style="font-size:13px;opacity:0.95">💵 pago: ' + f(totalReceived) + ' · ' + totalPayments + ' pagamento(s) confirmado(s) pela SexS</div>' +
          (aReceber > 0 ? '<div style="font-size:13px;margin-top:6px;background:rgba(255,255,255,.16);padding:6px 10px;border-radius:8px">⏳ a receber: <b>' + f(aReceber) + '</b></div>' : '<div style="font-size:13px;margin-top:6px">✅ tudo pago por enquanto</div>') +
        '</div>';
      })() +
    '</div>';
    
    // Resumo de kits encerrados
    var closedKitsHtml = '';
    if (closedKits.length > 0) {
      closedKitsHtml = '<div class="st">Resumo de Kits Encerrados</div>';
      
      closedKits.forEach(function(kit) {
        // Buscar vendas deste kit
        var kitSales = sales.filter(function(sale) { return sale.kit_id === kit.id; });
        
        var vendidos = 0;
        var devolvidos = 0;
        var totalVendido = 0;
        
        kitSales.forEach(function(sale) {
          if (sale.status === 'confirmada') {
            vendidos += sale.quantity;
            totalVendido += sale.quantity * (sale.unit_price_cents || 0);
          } else if (sale.status === 'rejeitada') {
            devolvidos += sale.quantity;
          }
        });
        
        var comissao = Math.round(totalVendido * (s.commission_pct || 0));
        // Unidades que voltaram ao estoque no fechamento (quantity_returned dos itens):
        // sem isso o kit encerrado parecia nao ter devolucao nenhuma.
        var devolvidasFechamento = (kit.items_returned !== undefined) ? kit.items_returned : devolvidos;
        var valorDevolvido = kit.returned_value_cents || 0;

        closedKitsHtml += '<div style="background:var(--p2);padding:16px;border-radius:var(--r2);border:1px solid var(--bd);margin-bottom:12px">' +
          '<div style="font-weight:600;margin-bottom:12px">Kit #' + kit.id + ' - ' + esc(kit.status.replace(/_/g, ' ')) + (kit.closed_at ? ' <span style="font-weight:400;color:var(--t3);font-size:11px">fechado em ' + esc(String(kit.closed_at).slice(0,10)) + '</span>' : '') + '</div>' +
          '<div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px">' +
            '<div><div style="font-size:10px;color:var(--t3);text-transform:uppercase">Vendidos</div><div style="font-size:18px;font-weight:700;color:#4ade80">' + ((kit.items_sold !== undefined) ? kit.items_sold : vendidos) + '</div></div>' +
            '<div><div style="font-size:10px;color:var(--t3);text-transform:uppercase">Devolvidos</div><div style="font-size:18px;font-weight:700;color:#3b82f6">' + devolvidasFechamento + '</div></div>' +
            '<div><div style="font-size:10px;color:var(--t3);text-transform:uppercase">Comissão</div><div style="font-size:18px;font-weight:700;color:var(--ac)">' + f(comissao) + '</div></div>' +
          '</div>' +
          (devolvidasFechamento > 0 ? '<div style="margin-top:10px;font-size:12px;color:var(--t2)">↩️ ' + devolvidasFechamento + ' un não vendidas voltaram para o estoque da SexS' + (valorDevolvido ? ' (R$ ' + (valorDevolvido/100).toFixed(2) + ' em mercadoria)' : '') + ' — nada é cobrado delas.</div>' : '') +
          (devolvidos > 0 ? '<div style="margin-top:6px;font-size:11px;color:var(--t3)">' + devolvidos + ' un de vendas estornadas/corrigidas no fechamento.</div>' : '') +
        '</div>';
      });
    }
    
    // Tabela de vendas do kit ativo
    var tableHtml = '';
    if (activeKits.length > 0 && sales.length > 0) {
      var activeKitIds = activeKits.map(function(k) { return k.id; });
      var activeSales = sales.filter(function(sale) { return activeKitIds.indexOf(sale.kit_id) !== -1; });
      
      if (activeSales.length > 0) {
        tableHtml = '<div class="st">Detalhes das Vendas (Kit Ativo)</div>' +
          '<div style="overflow-x:auto"><table style="width:100%;font-size:13px">' +
          '<tr><th>Produto</th><th style="text-align:center">Qtd</th><th style="text-align:right">Preço</th><th style="text-align:right">Total</th><th>Status</th><th style="text-align:right">Ações</th></tr>';
        
        activeSales.forEach(function(sale) {
          var estornado = (sale.note || '').indexOf('Estornado') === 0;
          var statusColors = {informada:'#ffa500', confirmada:'#4ade80', rejeitada: estornado ? '#a78bfa' : '#3b82f6'};
          var statusLabels = {informada:'⏳ Informada', confirmada:'✅ Confirmada', rejeitada: estornado ? '↩️ Estornada' : '📦 Devolução'};
          var total = sale.quantity * (sale.unit_price_cents||0);
          var action = sale.reversible
            ? '<button class="btn-s" style="background:transparent;border:1px solid var(--bd);color:var(--t2);padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer" onclick="reversePortalSale(' + sale.id + ')">↩️ Estornar</button>'
            : '<span style="color:var(--t3);font-size:11px">' + (sale.status === 'rejeitada' ? '—' : 'só a CEO') + '</span>';
          tableHtml += '<tr><td>' + esc(sale.product_name) + '</td>' +
            '<td style="text-align:center;font-weight:600">' + sale.quantity + '</td>' +
            '<td style="text-align:right">' + f(sale.unit_price_cents) + '</td>' +
            '<td style="text-align:right;font-weight:600">' + f(total) + '</td>' +
            '<td><span style="color:' + (statusColors[sale.status]||'var(--t2)') + '">' + (statusLabels[sale.status]||sale.status) + '</span>' +
              (sale.note ? '<div style="font-size:10px;color:var(--t3)">' + esc(sale.note) + '</div>' : '') + '</td>' +
            '<td style="text-align:right">' + action + '</td></tr>';
        });
        tableHtml += '</table></div><div style="font-size:11px;color:var(--t3);margin-top:8px">Estornar uma venda devolve as unidades para o seu kit e tira o valor do seu total. Depois do fechamento do kit, só a CEO consegue estornar.</div>';
      }
    }
    
    if (activeKits.length === 0 && closedKits.length === 0) {
      tableHtml = '<div class="empty">Nenhuma venda registrada ainda. Informe vendas na aba "Meus Kits"! 📦</div>';
    }
    
    v.innerHTML = '<div class="panel"><div class="st" style="margin-top:0">📊 Minhas Vendas</div>' + summaryHtml + closedKitsHtml + tableHtml + '</div>';
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>'; }
}

// ===== PORTAL: RECADOS =====
async function renderPortalMessages() {
  var v = $('#portal-messages'); if(!v) return;
  try {
    var data = await api('/api/portal/messages', {token: S.token});
    var msgs = data.messages || [];

    var formHtml = '<div class="panel" style="margin-bottom:20px">' +
      '<div class="st" style="margin-top:0">💬 Enviar Recado</div>' +
      '<div style="display:flex;gap:10px">' +
        '<input id="msgInput2" placeholder="Escreva seu recado para a CEO..." style="flex:1" />' +
        '<button class="btn-s" onclick="sendResellerMessage()" style="background:var(--ag);color:var(--bg);border:none;font-weight:600;padding:12px 20px;border-radius:var(--r1);cursor:pointer">Enviar</button>' +
      '</div></div>';

    var listHtml = '';
    if (msgs.length > 0) {
      listHtml = '<div class="panel"><div class="st" style="margin-top:0">Meus Recados (' + msgs.length + ')</div>';
      msgs.forEach(function(m) {
        var readBadge = m.read_at ? '<span style="color:#4ade80;font-size:10px"> ✓ lido</span>' : '<span style="color:#ffa500;font-size:10px"> ⏳ pendente</span>';
        listHtml += '<div class="il" style="flex-direction:column;align-items:flex-start;gap:4px">' +
          '<div style="display:flex;justify-content:space-between;width:100%"><span style="font-weight:500">' + esc(m.message) + '</span>' + readBadge + '</div>' +
          '<span style="font-size:11px;color:var(--t3)">' + esc(m.created_at) + '</span>' +
          '</div>';
      });
      listHtml += '</div>';
    } else {
      listHtml = '<div class="panel"><div class="empty">Nenhum recado enviado ainda.</div></div>';
    }

    v.innerHTML = formHtml + listHtml;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>'; }
}

async function sendResellerMessage() {
  var input = $('#msgInput2');
  var msg = input.value.trim();
  if (!msg) return toast('Escreva uma mensagem.');
  try {
    await api('/api/portal/messages', {method:'POST', token:S.token, body:JSON.stringify({message: msg})});
    input.value = '';
    toast('Recado enviado! ✅', 'ok');
    renderPortalMessages();
  } catch(e) { toast(e.message); }
}

async function renderPortalRanking() {
  var v = $('#portal-ranking'); if(!v) return;
  try {
    var data = await api('/api/portal/ranking', {token: S.token});
    var r = data.ranking;
    if (!r) { v.innerHTML = '<div class="panel"><div class="empty">Sem dados de ranking.</div></div>'; return; }
    v.innerHTML = '<div class="panel" style="text-align:center"><div class="st" style="margin-top:0">Sua posição</div>' +
      '<div style="font-family:Playfair Display,serif;font-size:48px;color:var(--ac)">'+r.position+'º</div>' +
      '<div style="color:var(--t3)">de '+r.total_resellers+' revendedoras</div>' +
      '<div style="font-size:18px;margin-top:12px">R$ '+(r.my_total_cents/100).toFixed(2)+' vendidos</div></div>';
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; }
}

async function renderPortalTips() {
  var v = $('#portal-tips'); if(!v) return;
  try {
    var data = await api('/api/portal/tips', {token: S.token});
    v.innerHTML = '<div class="panel"><div class="st" style="margin-top:0">💡 Dicas</div>' +
      (data.tips && data.tips.length ? data.tips.map(function(t){return '<div class="il"><span>'+esc(t.text)+'</span></div>';}).join('') : '<div class="empty">Nenhuma dica.</div>') +
      '</div>';
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; }
}

init();
</script>
