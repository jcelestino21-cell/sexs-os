<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a0b;--p1:#161214;--p2:#1e191c;--p3:#261f23;--ac:#d4919a;--acl:#e8b5bc;--acs:#3a2529;--ag:linear-gradient(135deg,#d4919a,#c47a8a,#b06878);--t1:#f5eaec;--t2:#b5a3a7;--t3:#786a6d;--bd:#2a2225;--bds:#3d3235;--dg:#d4717a;--dgs:#3a2025;--sc:#94b88a;--r1:10px;--r2:16px;--r3:24px;--rf:100px;--tr:all .25s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--t1);font-family:'DM Sans',-apple-system,sans-serif;min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:var(--ac);color:var(--bg)}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--bds);border-radius:10px}
.app{max-width:1100px;margin:0 auto;padding:28px 28px 80px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--bd)}
.hdr-brand{display:flex;align-items:center;gap:16px}.hdr-logo{height:42px;border-radius:8px}
.hdr-title{font-family:'Playfair Display',serif;font-weight:600;font-size:22px}.hdr-sub{color:var(--t3);font-size:13px;margin-top:2px}
.hdr-actions{display:flex;align-items:center;gap:12px}
.logout{color:var(--t3);font-size:13px;cursor:pointer;background:none;border:1px solid var(--bd);padding:8px 16px;border-radius:var(--rf);font-family:inherit;transition:var(--tr)}
.logout:hover{color:var(--dg);border-color:var(--dg)}
.lw{max-width:420px;margin:8vh auto;background:var(--p1);border:1px solid var(--bd);border-radius:var(--r3);padding:48px 40px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5),0 0 30px rgba(212,145,154,.08);position:relative;overflow:hidden}
.lw::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ag)}
.lw-logo{width:200px;margin:0 auto 24px;display:block;border-radius:12px}
.lw h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;margin-bottom:6px}
.lw p{color:var(--t2);font-size:14px;margin-bottom:28px}
.ig{text-align:left;margin-bottom:14px}.ig label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:6px;font-weight:500}
input,select{width:100%;background:var(--p2);border:1px solid var(--bds);color:var(--t1);border-radius:var(--r1);padding:12px 16px;font-size:14px;font-family:inherit;transition:var(--tr);outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(212,145,154,.12)}
input::placeholder{color:var(--t3)}
.btn-p{width:100%;background:var(--ag);color:var(--bg);border:none;border-radius:var(--r1);padding:14px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;transition:var(--tr);margin-top:8px}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.hint{font-size:12px;color:var(--t3);margin-top:20px;line-height:1.7}
.error{color:var(--dg);font-size:13px;margin-bottom:12px;padding:10px 14px;background:var(--dgs);border-radius:var(--r1)}
.toast-stack{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:10px;max-width:380px}
.toast{background:var(--p2);border:1px solid var(--bds);border-left:4px solid var(--dg);border-radius:var(--r1);padding:14px 18px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:ti .3s ease}
.toast.ok{border-left-color:var(--sc)}@keyframes ti{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tabs{display:flex;gap:4px;margin-bottom:28px;padding:4px;background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);overflow-x:auto}
.tab{padding:10px 20px;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;border-radius:var(--r1);transition:var(--tr);white-space:nowrap;flex-shrink:0;border:none;background:none;font-family:inherit}
.tab:hover{color:var(--t2);background:var(--p2)}.tab.active{color:var(--bg);background:var(--ag);font-weight:600}
.view{display:none;animation:fi .3s ease}.view.active{display:block}@keyframes fi{from{opacity:0}to{opacity:1}}
.layout{display:grid;grid-template-columns:220px 1fr;gap:24px}
.council{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);padding:16px 12px;height:fit-content;position:sticky;top:20px}
.council h2{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);margin:4px 10px 14px;font-weight:600}
.dir{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r1);margin-bottom:2px;cursor:pointer;transition:var(--tr);border-left:3px solid transparent;border:none;background:none;width:100%;text-align:left;font-family:inherit;color:var(--t1)}
.dir:hover{background:var(--p2)}.dir.active{background:var(--acs);border-left-color:var(--ac)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ag);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--bg);flex-shrink:0}
.dir .name{font-size:13px;font-weight:500}.dir .role{font-size:10px;color:var(--t3)}
.main{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);display:flex;flex-direction:column;min-height:540px;overflow:hidden}
.chat-tgt{padding:16px 22px;border-bottom:1px solid var(--bd);font-size:13px;color:var(--t2);background:var(--p2)}.chat-tgt b{color:var(--ac)}
.transcript{flex:1;padding:24px;overflow-y:auto;max-height:56vh}
.msg{margin-bottom:16px;max-width:85%;white-space:pre-wrap;line-height:1.6;font-size:14px}
.msg.ceo{margin-left:auto;background:var(--ag);color:var(--bg);border-radius:18px 18px 4px 18px;padding:12px 18px;font-weight:500}
.msg.agente{background:var(--p2);border-radius:18px 18px 18px 4px;padding:12px 18px;border:1px solid var(--bd)}
.msg.typing{display:inline-flex;gap:5px;padding:14px 20px}
.msg.typing span{width:6px;height:6px;border-radius:50%;background:var(--t3);animation:tb 1.2s infinite ease-in-out}
.msg.typing span:nth-child(2){animation-delay:.15s}.msg.typing span:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{opacity:.3}30%{opacity:1;transform:translateY(-4px)}}
.compose{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--bd);background:var(--p2)}
.compose input{flex:1;margin:0}.compose button{background:var(--ag);color:var(--bg);border:none;border-radius:var(--r1);padding:0 24px;font-weight:600;cursor:pointer;font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--bd)}
th{color:var(--t3);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:1px}
.panel{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);padding:24px}
.empty{color:var(--t3);font-size:13px;padding:28px;text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{margin:0}
select{background:var(--p2);border:1px solid var(--bds);color:var(--t1);border-radius:var(--r1);padding:10px 14px;font-size:13px;font-family:inherit}
.btn-s{background:var(--p2);color:var(--t1);border:1px solid var(--bds);border-radius:var(--r1);padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:var(--tr)}
.btn-s:hover{border-color:var(--ac)}
.btn-sm{font-size:11px;padding:7px 14px;border-radius:var(--r1);border:1px solid var(--bds);background:var(--p1);color:var(--t1);cursor:pointer;font-family:inherit}
.btn-sm.ok{background:var(--sc);border-color:var(--sc);color:var(--bg)}.btn-sm.no{background:var(--dg);border-color:var(--dg);color:var(--bg)}
.pill{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:4px 12px;border-radius:var(--rf);background:var(--acs);color:var(--ac);font-weight:600}
.kit-card{border:1px solid var(--bds);border-radius:var(--r2);padding:20px;margin-bottom:16px;background:var(--p2)}
.kit-card h3{margin:8px 0 6px;font-size:16px;font-family:'Playfair Display',serif;font-weight:500}
.il{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:center}.il:last-child{border-bottom:none}
.callout{background:var(--acs);border:1px solid rgba(212,145,154,.25);border-radius:var(--r1);padding:14px 16px;font-size:13px;margin-top:14px;word-break:break-all}
.link-token{color:var(--ac);font-weight:600}
.st{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);margin:24px 0 12px;font-weight:600}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.dc{background:var(--p1);border:1px solid var(--bd);border-radius:var(--r2);padding:22px}
.dc .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);font-weight:600;margin-bottom:10px}
.dc .value{font-family:'Playfair Display',serif;font-size:32px;font-weight:600;line-height:1}
.dc .sub{font-size:12px;color:var(--t2);margin-top:8px}
.dc.accent{border-color:rgba(212,145,154,.25);background:linear-gradient(135deg,var(--p1),var(--acs))}
.pc{background:var(--p2);border:1px solid var(--bds);border-radius:var(--r2);padding:18px;margin:8px 0 18px;font-size:13px}
.pc .risk{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:4px 12px;border-radius:var(--rf);background:var(--acs);color:var(--ac);font-weight:600;margin-bottom:10px}
.pa{display:flex;gap:10px;margin-top:14px}
.pa button{font-size:12px;padding:8px 18px;border-radius:var(--r1);border:1px solid var(--bds);background:var(--p1);color:var(--t1);cursor:pointer;font-family:inherit;transition:var(--tr)}
.pa .approve{background:var(--sc);border-color:var(--sc);color:var(--bg)}.pa .reject{background:var(--dg);border-color:var(--dg);color:var(--bg)}
#anaBtn{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:var(--ag);color:var(--bg);border:none;box-shadow:0 4px 20px rgba(0,0,0,.4);font-size:24px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center}
#anaBtn .dot{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;background:var(--dg);border:2px solid var(--bg);display:none}
#anaPanel{position:fixed;bottom:96px;right:24px;width:380px;max-width:calc(100vw - 48px);max-height:70vh;background:var(--p1);border:1px solid var(--bds);border-radius:var(--r3);box-shadow:0 8px 40px rgba(0,0,0,.5);z-index:200;display:flex;flex-direction:column;overflow:hidden}
#anaPanel .aw-hdr{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;background:var(--p2)}
#anaPanel .aw-hdr b{font-family:'Playfair Display',serif;font-size:15px;color:var(--ac)}
#anaPanel .aw-close{background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px}
#anaPanel .aw-msgs{flex:1;overflow-y:auto;padding:16px;max-height:42vh}
#anaPanel .aw-compose{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--bd);background:var(--p2)}
#anaPanel .aw-compose input{margin:0;flex:1;font-size:13px}
#anaPanel .aw-compose button{background:var(--ag);color:var(--bg);border:none;border-radius:var(--r1);padding:0 18px;font-weight:600;cursor:pointer;font-size:13px}
@media(max-width:720px){.app{padding:16px 14px 60px}.hdr{flex-direction:column;align-items:flex-start;gap:12px}.layout{grid-template-columns:1fr}.council{display:flex;overflow-x:auto;gap:8px;padding:12px;position:static}.council h2{display:none}.dir{flex-direction:column;text-align:center;gap:4px;min-width:68px;flex-shrink:0;border-left:none;border-bottom:3px solid transparent}.dir.active{border-bottom-color:var(--ac)}.dir .role{display:none}.dg{grid-template-columns:1fr 1fr}.transcript{max-height:46vh}.lw{margin:4vh auto;max-width:92vw;padding:32px 24px}.lw-logo{width:160px}#anaPanel{right:12px;bottom:88px;width:calc(100vw - 24px)}}
</style>

<body>
<div id="app" class="app">
<div class="lw">
<img src="/logo-lg.png" alt="SexS" class="lw-logo" />
<h1>Central da CEO</h1>
<p>Acesso restrito à equipe executiva.</p>
<form method="GET" action="/login">
<div class="ig"><label>Usuário</label><input name="username" placeholder="seu usuário" autocomplete="username" required /></div>
<div class="ig"><label>Senha</label><input name="password" placeholder="sua senha" type="password" autocomplete="current-password" required /></div>
<button type="submit" class="btn-p">Entrar</button>
</form>
</div>
</div>
<div class="toast-stack" id="toastStack"></div>
<script>
var D=[{k:'ana',n:'Ana',r:'Chefe de Gabinete'},{k:'diego',n:'Diego',r:'Operações'},{k:'renata',n:'Renata',r:'Financeiro'},{k:'ricardo',n:'Ricardo',r:'Comercial'},{k:'theo',n:'Theo',r:'Marketing'},{k:'marina',n:'Marina',r:'RH'},{k:'arthur',n:'Arthur',r:'Conselheiro'}];
var S={token:null,user:null,caps:[],thread:'ana'};
var execCache={};

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function toast(m,k){var s=$('#toastStack');if(!s)return;var e=document.createElement('div');e.className='toast'+(k==='ok'?' ok':'');e.textContent=m;s.appendChild(e);setTimeout(function(){e.remove()},5000)}
function fmt(c){return'R$ '+(c/100).toFixed(2)}
function can(c){if(!S.caps)return false;if(S.caps.indexOf('*')>=0)return true;return S.caps.indexOf(c)>=0}

// API call usando fetch normal (Render não tem problema de proxy)
function api(path, opts) {
  opts = opts || {};
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    var method = (opts.method || 'GET').toUpperCase();
    var url = path;
    
    // Para GET, adicionar token na query string
    if (method === 'GET' && S.token) {
      url += (url.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(S.token);
    }
    
    xhr.open(method, url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    if (S.token && method !== 'GET') {
      xhr.setRequestHeader('Authorization', 'Bearer ' + S.token);
    }
    
    xhr.onload = function() {
      try {
        var data = JSON.parse(xhr.responseText);
      } catch(e) {
        var data = {};
      }
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(data);
      } else {
        reject(new Error(data.error || ('Erro ' + xhr.status)));
      }
    };
    
    xhr.onerror = function() {
      reject(new Error('Erro de conexão'));
    };
    
    xhr.send(opts.body || null);
  });
}

// ===== LOGIN =====
function init() {
  try {
    // Verificar se há mensagem de erro na URL (ex: /#error=senha+errada)
    var hash = window.location.hash;
    if (hash.indexOf('#error=') === 0) {
      var errorMsg = decodeURIComponent(hash.substring(7));
      renderLogin(errorMsg);
      // Limpar o hash da URL
      history.replaceState(null, '', '/');
      return;
    }
    
    // Verificar se é primeiro acesso de revendedora
    if (hash.indexOf('#primeiro-acesso=') === 0) {
      var firstAccessToken = hash.substring(17);
      renderFirstAccess(firstAccessToken);
      // Limpar o hash da URL
      history.replaceState(null, '', '/');
      return;
    }
    
    // SSR: verificar se o token foi injetado pelo servidor
    if (window.SEXS_TOKEN && window.SEXS_USER) {
      S.token = window.SEXS_TOKEN;
      S.user = window.SEXS_USER;
      S.caps = window.SEXS_CAPS || [];
      try { localStorage.setItem('sexsos_token', S.token); } catch(e) {}
      renderApp();
      return;
    }
    
    var saved = null;
    try { saved = localStorage.getItem('sexsos_token'); } catch(e) {}
    if (saved) { S.token = saved; loadUser(); return; }
    renderLogin();
  } catch(e) {
    // Fallback: se qualquer coisa falhar, mostrar login
    try { localStorage.removeItem('sexsos_token'); } catch(e2) {}
    var root = document.getElementById('app');
    if (root) {
      root.innerHTML = '<div class="lw"><img src="/logo-lg.png" alt="SexS" class="lw-logo" /><h1>Central da CEO</h1><p>Acesso restrito.</p>' +
        '<form method="GET" action="/login">' +
        '<div class="ig"><label>Usuário</label><input name="username" placeholder="seu usuário" required /></div>' +
        '<div class="ig"><label>Senha</label><input name="password" type="password" placeholder="sua senha" required /></div>' +
        '<button type="submit" class="btn-p">Entrar</button></form></div>';
    }
  }
}

// ===== PRIMEIRO ACESSO DA REVENDEDORA =====
function renderFirstAccess(token) {
  var root = $('#app'); root.innerHTML = '';
  root.appendChild(el(
    '<div class="lw">' +
    '<img src="/logo-lg.png" alt="SexS" class="lw-logo" />' +
    '<h1>Bem-vinda! 🌸</h1>' +
    '<p>Crie sua senha pessoal para acessar o portal. Ninguém mais vai vê-la.</p>' +
    '<div id="faError" class="error" style="display:none"></div>' +
    '<div class="ig"><label>Nova senha</label><input id="faPassword" type="password" placeholder="mínimo 8 caracteres" /></div>' +
    '<div class="ig"><label>Confirme a senha</label><input id="faPasswordConfirm" type="password" placeholder="repita a senha" /></div>' +
    '<button class="btn-p" id="faBtn" onclick="submitFirstAccess(\'' + token + '\')">Criar senha e entrar</button>' +
    '</div>'
  ));
}

async function submitFirstAccess(token) {
  var password = $('#faPassword').value;
  var confirm = $('#faPasswordConfirm').value;
  var errBox = $('#faError');

  if (password.length < 8) {
    errBox.textContent = 'A senha precisa ter pelo menos 8 caracteres.';
    errBox.style.display = 'block';
    return;
  }
  if (password !== confirm) {
    errBox.textContent = 'As senhas não conferem. Tente novamente.';
    errBox.style.display = 'block';
    return;
  }

  try {
    var res = await fetch('/api/first-access/' + token + '/set-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: password})
    });
    var data = {};
    try { data = await res.json(); } catch(e) {}
    if (!res.ok) throw new Error(data.error || 'Erro ao criar senha');

    // Senha criada! Mostrar tela com o username
    history.replaceState(null, '', '/');
    renderLoginSuccess(data.username, data.name);
  } catch(e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
  }
}

// Tela de sucesso após criar senha — mostra o username para a revendedora
function renderLoginSuccess(username, name) {
  var root = $('#app'); root.innerHTML = '';
  root.appendChild(el(
    '<div class="lw">' +
    '<img src="/logo-lg.png" alt="SexS" class="lw-logo" />' +
    '<h1>Senha criada! 🎉</h1>' +
    '<p style="margin-bottom:16px">Prontinho, ' + esc(name || 'revendedora') + '! Sua senha foi criada com sucesso.</p>' +
    '<div class="callout" style="margin-bottom:24px;text-align:center">' +
    '<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-bottom:8px">Seu usuário para login:</div>' +
    '<div style="font-size:22px;font-family:Playfair Display,serif;font-weight:600;color:var(--ac)">' + esc(username) + '</div>' +
    '</div>' +
    '<div class="hint" style="margin-bottom:20px">⚠️ Anote esse usuário! Você vai precisar dele junto com a senha que acabou de criar.</div>' +
    '<form method="GET" action="/login">' +
    '<div class="ig"><label>Usuário</label><input name="username" value="' + esc(username) + '" autocomplete="username" /></div>' +
    '<div class="ig"><label>Senha</label><input name="password" type="password" placeholder="a senha que você acabou de criar" autocomplete="current-password" required /></div>' +
    '<button type="submit" class="btn-p">Entrar no meu portal</button>' +
    '</form>' +
    '</div>'
  ));
}

async function loadUser() {
  try {
    var me = await api('/api/me');
    S.user = me.user;
    S.caps = me.capabilities || [];
    try { localStorage.setItem('sexsos_token', S.token); } catch(e) {}
    renderApp();
  } catch(e) {
    console.error('loadUser error:', e);
    S.token = null;
    try { localStorage.removeItem('sexsos_token'); } catch(e) {}

    document.body.appendChild(debugDiv);

function switchTab(tab) {
  // Remove active class from all tabs and views
  var btns = $$('.tab'); 
  var views = $$('.view');
  btns.forEach(function(b){b.classList.remove('active')});
  views.forEach(function(v){v.classList.remove('active')});
  
  // Find and activate the correct button by matching onclick
  btns.forEach(function(btn) {
    var onclick = btn.getAttribute('onclick');
    if (onclick && onclick.includes("switchTab('" + tab + "')")) {
      btn.classList.add('active');
    }
  });
  
  // Activate the correct view by ID
  var view = document.getElementById('v-'+tab);
  if (view) view.classList.add('active');
  
  // Call the render function
  var r = {
    dashboard:renderDashboard,
    chat:renderChat,
    proposals:renderProposals,
    resellers:renderResellers,
    orders:renderOrders,
    kits:renderKits,
    'products-resellers':renderProductsResellers,
    financial:renderFinancial,
    stock:renderStock,
    kitdetails:renderKitDetails,
    resellerMsgs:renderResellerMessages,
    audit:renderAudit
  };
  if (r[tab]) r[tab]();
}

var kitItems = [];

function addToKit() {
  var prodSelect = $('#kitProd');
  var qty = Number($('#kitQty').value);
  if (!qty || qty < 1) return toast('Informe a quantidade.');
  
  var productId = Number(prodSelect.value);
  var productName = prodSelect.options[prodSelect.selectedIndex].text.split(' (disp.')[0];
  var price = Number(prodSelect.options[prodSelect.selectedIndex].getAttribute('data-price'));
  
  // Verificar se já existe
  var existing = kitItems.find(i => i.product_id === productId);
  if (existing) {
    existing.quantity += qty;
  } else {
    kitItems.push({ product_id: productId, product_name: productName, quantity: qty, price: price });
  }
  
  renderKitItemsList();
  $('#kitQty').value = '1';
}

function removeFromKit(index) {
  kitItems.splice(index, 1);
  renderKitItemsList();
}

function renderKitItemsList() {
  var container = $('#kitItemsList');
  if (!container) return;
  
  if (kitItems.length === 0) {
    container.innerHTML = '<div style="color:var(--t3);font-size:12px;text-align:center;padding:8px">Nenhum produto adicionado</div>';
    return;
  }
  
  var total = kitItems.reduce((sum, i) => sum + (i.quantity * i.price / 100), 0);
  var html = '<div style="border:1px solid var(--border);border-radius:4px;padding:8px;background:var(--bg-secondary)">';
  html += '<div style="font-size:12px;color:var(--t2);margin-bottom:8px"><strong>Produtos no kit (' + kitItems.length + '):</strong></div>';
  
  kitItems.forEach(function(item, index) {
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)">';
    html += '<div style="flex:1;font-size:13px">' + esc(item.product_name) + ' <span style="color:var(--t3)">x' + item.quantity + '</span></div>';
    html += '<div style="font-size:12px;color:var(--t2);margin-right:8px">R$ ' + (item.quantity * item.price / 100).toFixed(2) + '</div>';

async function finalizeAllReconciliations(kitId) {
  try {
    toast('Finalizando conferências...', 'ok');
    // First confirm all pending sales
    var salesData = await api('/api/kits/' + kitId + '/pending-sales');
    if (salesData.sales) {
      for (var s of salesData.sales) {
        if (s.status === 'informada') {
          await api('/api/kit-sales/' + s.id + '/decide', {method:'POST', body:JSON.stringify({action:'confirm'})});
        }
      }
    }
    // Then finalize all reconciliation items
    var reconData = await api('/api/kits/' + kitId + '/reconciliation');
    if (reconData.items) {
      for (var item of reconData.items) {
        if (!item.finalized) {
          await api('/api/kits/' + kitId + '/reconciliation/' + item.kit_item_id, {
            method:'POST',
            body:JSON.stringify({
              quantity_sold_confirmed: item.quantity_sold_confirmed || 0,
              quantity_returned: item.quantity_returned || 0,
              finalized: true
            })
          });
        }
      }
    }
    toast('Todas as conferências finalizadas! Agora clique em "Aprovar Fechamento".', 'ok');
    renderKits();
  } catch(e) { toast('Erro: ' + e.message); }
}

async function toggleKitDetails(kitId) {
  var div = document.getElementById('kit-details-' + kitId);
  if (!div) return;
  if (div.style.display === 'none') {
    div.style.display = 'block';
    div.innerHTML = '<div style="color:var(--t3);font-size:13px">Carregando itens...</div>';
    try {
      var data = await api('/api/kits/' + kitId);
      var kit = data.kit || data;
      var items = kit.items || [];
      var totalSold = 0, totalReturned = 0;
      var html = '<div style="font-size:12px;color:var(--t2);margin-bottom:12px">' + items.length + ' tipos de produtos</div>';
      html += '<table style="width:100%;font-size:12px"><tr><th style="text-align:left">Produto</th><th style="text-align:center">Entregue</th><th style="text-align:center;color:#4ade80">Vendido</th><th style="text-align:center;color:#ffa500">Devolver</th><th style="text-align:right">Preço</th><th style="text-align:right">Subtotal</th></tr>';
      items.forEach(function(item) {
        var sold = (item.quantity_pending_closure || 0) + (item.quantity_confirmed_sold || 0);
        var avail = item.quantity_available || 0;
        var price = (item.unit_sale_price_cents || 0) / 100;
        var subtotal = sold * price;
        totalSold += subtotal;
        totalReturned += avail * price;
        var rowStyle = sold > 0 ? 'background:rgba(74,222,128,.05)' : (avail > 0 ? 'background:rgba(255,165,0,.05)' : '');
        html += '<tr style="' + rowStyle + '">';
        html += '<td style="font-weight:500">' + (item.product_name || '?') + '</td>';
        html += '<td style="text-align:center">' + (item.quantity_delivered || 0) + '</td>';
        html += '<td style="text-align:center;color:#4ade80;font-weight:600">' + sold + '</td>';
        html += '<td style="text-align:center;color:#ffa500;font-weight:600">' + avail + '</td>';
        html += '<td style="text-align:right">R$ ' + price.toFixed(2) + '</td>';
        html += '<td style="text-align:right;font-weight:600">R$ ' + subtotal.toFixed(2) + '</td>';
        html += '</tr>';
      });
      html += '</table>';
      var commission = kit.reseller ? kit.reseller.commission_pct : 0.3;
      var commissionValue = totalSold * commission;
      html += '<div style="margin-top:16px;padding:12px;background:var(--p3);border-radius:8px;font-size:13px">';
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Total vendido:</span><b style="color:#4ade80">R$ ' + totalSold.toFixed(2) + '</b></div>';
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Comissão (' + Math.round(commission*100) + '%):</span><b style="color:var(--ac)">R$ ' + commissionValue.toFixed(2) + '</b></div>';
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Valor devido à SexS:</span><b>R$ ' + (totalSold - commissionValue).toFixed(2) + '</b></div>';
      html += '<div style="display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:4px;margin-top:4px"><span>Itens para devolução:</span><b style="color:#ffa500">' + items.reduce(function(s,i){return s+(i.quantity_available||0)},0) + ' un (R$ ' + totalReturned.toFixed(2) + ')</b></div>';
      html += '</div>';
      div.innerHTML = html;
    } catch(e) {
      div.innerHTML = '<div style="color:var(--dg)">Erro: ' + e.message + '</div>';
    }
  } else {
    div.style.display = 'none';
  }
}

function filterProdRes() {
  var q = ($('#prodSearch').value || '').toLowerCase();
  var cards = $$('.prod-res-card');

    c.style.display = text.indexOf(q) >= 0 ? '' : 'none';

// ===== PEDIDOS DAS REVENDEDORAS =====
async function renderOrders() {
  var v = $('#v-orders'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  
  try {
    // Buscar todas as revendedoras
    var resellersResponse = await api('/api/resellers');
    var resellers = resellersResponse.resellers || [];
    
    // Buscar todos os pedidos pendentes
    var allOrders = [];
    for (var reseller of resellers) {
      var ordersResponse = await api('/api/admin/reseller-orders/' + reseller.id);
      var orders = ordersResponse.orders || [];
      var pendingOrders = orders.filter(function(o) { return o.status === 'pendente'; });
      
      if (pendingOrders.length > 0) {
        allOrders.push({
          reseller: reseller,
          orders: pendingOrders
        });
      }
    }
    
    // Buscar kits em aberto (sugeridos)
    var kitsResponse = await api('/api/kits');
    var kits = kitsResponse.kits || [];
    var openKits = kits.filter(function(k) { return k.status === 'sugerido'; });
    
    var html = '<div class="panel"><div class="st" style="margin-top:0">📋 Gerenciar Pedidos</div>';
    
    // Mostrar kits em aberto
    if (openKits.length > 0) {
      html += '<div style="margin-bottom:24px">';
      html += '<div style="font-weight:600;margin-bottom:12px;color:var(--ac)">Kits em Aberto (' + openKits.length + ')</div>';
      
      for (var kit of openKits) {
        var kitDetailResponse = await api('/api/kits/' + kit.id);
        var kitDetail = kitDetailResponse.kit;
        var items = kitDetail.items || [];
        
        html += '<div style="background:var(--p2);padding:16px;border-radius:var(--r2);border:2px solid var(--ac);margin-bottom:12px">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
        html += '<div><strong>Kit #' + kit.id + ' - ' + esc(kit.reseller_name) + '</strong></div>';
        html += '<button class="btn-s" onclick="approveKit(' + kit.id + ')">✅ Aprovar Kit</button>';
        html += '</div>';
        
        html += '<div style="font-size:13px;color:var(--t2);margin-bottom:8px">Itens no kit:</div>';
        for (var item of items) {
          html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)">';
          html += '<span>' + esc(item.product_name) + '</span>';
          html += '<span><strong>' + item.quantity_suggested + ' un</strong></span>';
          html += '</div>';
        }
        
        html += '<div style="margin-top:12px">';
        html += '<button class="btn-sm" onclick="addItemToKit(' + kit.id + ')">+ Adicionar Produto</button>';
        html += '</div>';
        
        html += '</div>';
      }
      
      html += '</div>';
    }
    
    // Mostrar pedidos por revendedora
    if (allOrders.length > 0) {
      html += '<div style="font-weight:600;margin-bottom:12px">Pedidos Pendentes por Revendedora</div>';
      
      for (var item of allOrders) {
        var reseller = item.reseller;
        var orders = item.orders;
        
        html += '<div style="background:var(--p2);padding:16px;border-radius:var(--r2);border:1px solid var(--bd);margin-bottom:16px">';
        html += '<div style="font-weight:600;margin-bottom:12px">' + esc(reseller.name) + ' (' + orders.length + ' pedidos)</div>';
        
        for (var order of orders) {
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)">';
          html += '<div>';
          html += '<div style="font-weight:500">' + esc(order.product_name) + '</div>';
          html += '<div style="font-size:12px;color:var(--t3)">Qtd: ' + order.quantity_requested + '</div>';
          html += '</div>';
          html += '<button class="btn-sm" onclick="openSeparateModal(' + order.id + ', ' + order.quantity_requested + ', \'' + esc(order.product_name).replace(/'/g, "\\'") + '\')">Separar</button>';
          html += '</div>';
        }
        
        html += '</div>';
      }
    } else {
      html += '<div class="empty">Nenhum pedido pendente no momento.</div>';
    }
    
    html += '</div>';
    
    // Modal de separação
    html += '<div id="separateModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center">';
    html += '<div style="background:var(--p1);padding:24px;border-radius:var(--r2);max-width:400px;width:90%">';
    html += '<div style="font-weight:600;margin-bottom:16px">Separar Pedido</div>';
    html += '<div id="modalProductName" style="margin-bottom:12px"></div>';
    html += '<div style="margin-bottom:16px">';
    html += '<label style="display:block;margin-bottom:6px">Quantidade a separar:</label>';
    html += '<input type="number" id="modalQuantity" min="1" style="width:100%" />';
    html += '</div>';
    html += '<div style="display:flex;gap:10px">';
    html += '<button class="btn-s" onclick="confirmSeparate()" style="flex:1">Confirmar</button>';
    html += '<button class="btn-sm" onclick="closeSeparateModal()" style="flex:1">Cancelar</button>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
    
    v.innerHTML = html;
  } catch(e) {
    v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>';
  }
}

var currentOrderId = null;
var maxQuantity = 0;

function openSeparateModal(orderId, quantity, productName) {
  currentOrderId = orderId;
  maxQuantity = quantity;
  document.getElementById('modalProductName').innerHTML = '<strong>' + productName + '</strong> (Qtd: ' + quantity + ')';
  document.getElementById('modalQuantity').value = quantity;
  document.getElementById('modalQuantity').max = quantity;
  document.getElementById('separateModal').style.display = 'flex';
}

function closeSeparateModal() {
  document.getElementById('separateModal').style.display = 'none';
  currentOrderId = null;
}

async function confirmSeparate() {
  var quantity = parseInt(document.getElementById('modalQuantity').value);
  
  if (!quantity || quantity < 1 || quantity > maxQuantity) {
    toast('Quantidade inválida');
    return;
  }
  
  try {
    await api('/api/admin/separate-order', {
      method: 'POST',
      body: JSON.stringify({
        order_id: currentOrderId,
        quantity_to_separate: quantity
      })
    });
    
    toast('Itens separados com sucesso!', 'ok');
    closeSeparateModal();
    renderOrders();
  } catch(e) {
    toast('Erro: ' + e.message);
  }
}

async function renderStock() {
  var v = $('#v-stock'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    var [prodData, movData] = await Promise.all([api('/api/products'), api('/api/stock-movements')]);
    var f = function(c) { return c ? 'R$ ' + (c/100).toFixed(2) : '—'; };
    
    // Comissões das revendedoras
    var COM30 = 0.30; // Yasmin, Flavia
    var COM25 = 0.25; // Larissa, Taina, Luana, Gizelle
    
    // Calcular preço sugerido: custo ÷ (1 - maior_comissão - margem_desejada)
    // Com 30% comissão e margem de 20%: preço = custo ÷ 0.50 = custo ×2 → muito baixo
    // Usando custo ×3: com 30% comissão, sobra custo×2.1, lucro = custo×1.1 ✓
    // Usando custo ×3: com 25% comissão, sobra custo×2.25, lucro = custo×1.25 ✓
    function calcSalePrice(cost) { return Math.round(cost * 3); }
    function calcProfit(cost, salePct) {
      var sale = calcSalePrice(cost);
      var comm = Math.round(sale * salePct);
      return sale - comm - cost;
    }
    
    // Totais
    var totalCost = 0, totalQty = 0;
    var totalProfit30 = 0, totalProfit25 = 0;
    
    prodData.products.forEach(function(p) {
      var cost = p.last_purchase_cost_cents || 0;
      var avail = p.available_balance || 0;
      var reserved = p.reserved || 0;
      var totalOwned = avail + reserved; // total que a empresa possui
      totalCost += cost * totalOwned;
      totalQty += totalOwned;
      totalProfit30 += calcProfit(cost, COM30) * totalOwned;
      totalProfit25 += calcProfit(cost, COM25) * totalOwned;
    });
    
    // Cards resumo
    var totalReserved = prodData.products.reduce(function(s,p){ return s + (p.reserved||0); }, 0);

      '</div>' +

        '<div style="font-size:22px;font-weight:700;color:' + (totalReserved > 0 ? '#ffa500' : 'var(--t1)') + ';margin-top:4px;font-family:Playfair Display,serif">' + totalReserved + ' un</div>' +
        '<div style="font-size:10px;color:var(--t3)">com revendedoras</div>' +
      '</div>' +
    '</div>';
    
    // Revendedoras info
    var resellersHtml = '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid var(--bd);margin-bottom:16px">' +

        '<span style="background:var(--acs);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:12px"><b>Larissa</b> 25%</span>' +
        '<span style="background:var(--acs);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:12px"><b>Taina</b> 25%</span>' +
        '<span style="background:var(--acs);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:12px"><b>Luana</b> 25%</span>' +
        '<span style="background:var(--acs);color:#4ade80;padding:4px 12px;border-radius:20px;font-size:12px"><b>Gizelle</b> 25%</span>' +
      '</div>' +
    '</div>';
    
    // Legenda
    var legendHtml = '<div style="margin-bottom:12px;font-size:11px;color:var(--t3);line-height:1.8">' +
      '<b>Disponível</b> = estoque livre no armazém · ' +

        '<div style="font-size:12px;color:var(--t2);margin-bottom:10px">' + totalQty + ' itens · ' + totalSold + ' vendidos · Valor: ' + f(totalValue) + '</div>' +
        '<table style="width:100%;font-size:13px">' +
        '<tr><th>Produto</th><th style="text-align:center">Entregue</th><th style="text-align:center">Vendido</th><th style="text-align:center">Restante</th><th style="text-align:right">Preço</th></tr>';
      resellerItems.forEach(function(i) {
        var remaining = (i.quantity_delivered||0) - (i.quantity_confirmed_sold||0) - (i.quantity_returned||0);
        html += '<tr><td>' + esc(i.product_name) + '</td>' +
          '<td style="text-align:center">' + (i.quantity_delivered||0) + '</td>' +
          '<td style="text-align:center;color:#4ade80;font-weight:600">' + (i.quantity_confirmed_sold||0) + '</td>' +

    v.innerHTML = html;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>'; }
}

function switchPortalTab(tab) {
  $$('.tab').forEach(function(t){t.classList.remove('active')});
  $$('.view').forEach(function(v){v.classList.remove('active')});
  event.target.classList.add('active');
  document.getElementById('portal-'+tab).classList.add('active');
  if (tab === 'kits') renderPortalKits();
  if (tab === 'sales') renderPortalSales();
  if (tab === 'catalog') renderPortalCatalog();
  if (tab === 'orders') renderPortalOrders();
  if (tab === 'messages') renderPortalMessages();

        '<div style="flex:0.5;min-width:70px"><label style="font-size:11px;color:var(--t3);text-transform:uppercase;display:block;margin-bottom:4px">Qtd</label>' +
          '<input id="orderQty" type="number" min="1" value="1" style="width:100%" /></div>' +
        '<div style="flex:1;min-width:140px"><label style="font-size:11px;color:var(--t3);text-transform:uppercase;display:block;margin-bottom:4px">Observação</label>' +
          '<input id="orderNote" placeholder="ex: urgente" style="width:100%" /></div>' +
        '<button class="btn-s" onclick="submitOrder()" style="padding:12px 20px;background:var(--ag);color:var(--bg);border:none;font-weight:600;border-radius:var(--r1);cursor:pointer">Pedir</button>' +
      '</div></div>';
    
    // Lista de pedidos existentes
    var ordersHtml = '';
    if (ordersData.orders && ordersData.orders.length > 0) {
      ordersHtml = '<div class="panel"><div class="st" style="margin-top:0">Meus Pedidos (' + ordersData.orders.length + ')</div>' +
        '<table style="width:100%;font-size:13px"><tr><th>Produto</th><th style="text-align:center">Qtd</th><th>Status</th><th>Quando</th><th style="text-align:center">Ações</th></tr>' +
        ordersData.orders.map(function(o){
          var actions = '';
          if (o.status === 'pendente') {
            actions = '<button class="btn-sm" onclick="editOrder(' + o.id + ', ' + o.quantity_requested + ')" style="margin-right:4px">✏️</button>' +
                      '<button class="btn-sm" onclick="cancelOrder(' + o.id + ')" style="background:#ff6b6b;color:white">🗑️</button>';
          }
          return '<tr><td>'+esc(o.product_name || 'Produto #'+o.product_id)+'</td>' +
            '<td style="text-align:center;font-weight:600">'+o.quantity_requested+'</td>' +
            '<td><span style="color:'+(statusColors[o.status]||'var(--t2)')+'">'+esc(statusLabels[o.status]||o.status)+'</span></td>' +
            '<td style="color:var(--t3);font-size:11px">'+esc(o.created_at || '')+'</td>' +
            '<td style="text-align:center">'+actions+'</td></tr>';
        }).join('') + '</table></div>';
    } else {
      ordersHtml = '<div class="panel"><div class="empty">Nenhum pedido feito ainda. Use o formulário acima para pedir produtos! 📋</div></div>';
    }
    
    v.innerHTML = newOrderHtml + ordersHtml;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; }
}

async function submitOrder() {
  var productId = Number($('#orderProduct').value);
  var qty = Number($('#orderQty').value);
  var note = $('#orderNote').value.trim();
  if (!productId) return toast('Selecione um produto.');
  if (!qty || qty < 1) return toast('Informe a quantidade.');
  try {
    await api('/api/portal/orders', {method:'POST', token:S.token, body:JSON.stringify({product_id: productId, quantity: qty, note: note})});
    toast('Pedido enviado! ✅', 'ok');
    renderPortalOrders();
  } catch(e) { toast(e.message); }
}

async function editOrder(orderId, currentQty) {
  var newQty = prompt('Nova quantidade:', currentQty);
  if (!newQty || isNaN(newQty) || Number(newQty) < 1) return;
  
  try {
    await api('/api/portal/orders/' + orderId, {method:'PUT', token:S.token, body:JSON.stringify({quantity: Number(newQty)})});
    toast('Pedido atualizado! ✅', 'ok');
    renderPortalOrders();
  } catch(e) { toast(e.message); }
}

async function cancelOrder(orderId) {
  if (!confirm('Tem certeza que deseja cancelar este pedido?')) return;
  
  try {
    await api('/api/portal/orders/' + orderId, {method:'DELETE', token:S.token});
    toast('Pedido cancelado! ✅', 'ok');
    renderPortalOrders();
  } catch(e) { toast(e.message); }
}

async function renderPortalKits() {
  var v = $('#portal-kits'); if(!v) return;
  try {
    var data = await api('/api/portal/kits', {token: S.token});
    if (!data.kits || !data.kits.length) {
      v.innerHTML = '<div class="panel"><div class="empty">Nenhum kit disponível ainda.</div></div>';
      return;
    }
    
    // Filtrar apenas kits ativos (não encerrados)
    var activeKits = data.kits.filter(function(k) { return k.status !== 'encerrado'; });
    
    if (!activeKits.length) {
      v.innerHTML = '<div class="panel"><div class="empty">Seu kit anterior foi encerrado. Aguarde o próximo kit! 📦</div></div>';
      return;
    }
    
    // Filtrar apenas kits entregues ou aguardando fechamento (prontos para venda)
    var readyKits = activeKits.filter(function(k) { 
      return k.status === 'entregue' || k.status === 'aguardando_fechamento'; 
    });
    
    // Se não tem kits prontos para venda, mostrar status dos kits em preparação
    if (!readyKits.length) {
      var html = '<div class="panel"><div class="st" style="margin-top:0">Status dos Seus Kits</div>';
      
      activeKits.forEach(function(k) {
        var statusMessages = {
          'sugerido': '⏳ Seu kit está sendo preparado pela CEO. Aguarde a aprovação!',
          'aprovado': '✅ Seu kit foi aprovado! Aguarde a entrega.',
          'em_preparacao': '📦 Seu kit está sendo preparado. Aguarde a entrega!'
        };
        
        html += '<div style="background:var(--p2);padding:16px;border-radius:var(--r2);border:1px solid var(--bd);margin-bottom:12px">';
        html += '<div style="font-weight:600;margin-bottom:8px">Kit #' + k.id + '</div>';
        html += '<div style="color:var(--t2)">' + (statusMessages[k.status] || 'Status: ' + k.status) + '</div>';
        html += '</div>';
      });
      
      html += '</div>';
      v.innerHTML = html;
      return;
    }
    
    // Coletar TODOS os itens de todos os kits prontos para venda
    var allItems = [];
    var hasDelivered = false;
    var totalValue = 0;
    
    for (var k of readyKits) {
      try {
        var detail = await api('/api/portal/kits/'+k.id, {token: S.token});
        var kit = detail.kit;
        if (kit.status === 'entregue' || kit.status === 'aguardando_fechamento') hasDelivered = true;
        if (kit.items) {
          kit.items.forEach(function(item) {
            item._kitId = k.id;
            item._kitStatus = kit.status;
            allItems.push(item);
            totalValue += (item.unit_sale_price_cents || 0) * (item.quantity_available || 0);
          });
        }
      } catch(e) {}
    }
    
    var html = '<div class="kit-card"><span class="pill">'+esc(readyKits[0].status.replace(/_/g,' '))+'</span><h3>Meus Produtos</h3>' +
      '<div style="font-size:12px;color:var(--t3);margin-bottom:12px">'+allItems.length+' produtos · Valor total: <b style="color:var(--ac)">R$ '+(totalValue/100).toFixed(2)+'</b></div>';
    
    // Lista de todos os produtos juntos
    allItems.forEach(function(item) {
      html += '<div class="il"><span>'+esc(item.product_name)+'</span>';
      html += '<span><b>R$ '+(item.unit_sale_price_cents/100).toFixed(2)+'</b></span></div>';
    });
    
    // Se tem kit entregue, mostrar formulário de venda unificado
    if (hasDelivered) {
      html += '<div class="st">Informar venda</div>';
      allItems.forEach(function(item) {
        if (item.quantity_available > 0 && (item._kitStatus === 'entregue' || item._kitStatus === 'aguardando_fechamento')) {
          html += '<div class="row" style="margin-bottom:8px"><span style="flex:1;font-size:13px">'+esc(item.product_name)+'</span>' +
            '<input type="number" min="1" max="'+item.quantity_available+'" placeholder="qtd" style="width:70px" id="sale-'+item.id+'" />' +
            '<button class="btn-sm ok" onclick="informSale('+item.id+')">Vender</button></div>';
        }
      });
      
      // Botão solicitar fechamento
      var openKitIds = readyKits.filter(function(k){return k.status==='entregue'||k.status==='aguardando_fechamento'}).map(function(k){return k.id});
      html += '<div style="margin-top:16px;text-align:center"><button class="btn-s" onclick="requestClosureAll(['+openKitIds.join(',')+'])">📋 Solicitar Fechamento</button></div>';
    }
    
    html += '</div>';
    v.innerHTML = html;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; }
}

async function requestClosureAll(kitIds) {
  for (var id of kitIds) {
    try { await api('/api/portal/kits/'+id+'/request-closure', {method:'POST', token:S.token, body:'{}'}); } catch(e) {}
  }
  toast('Fechamento solicitado! ✅', 'ok');
  renderPortalKits();
}

async function informSale(itemId) {
  var input = document.getElementById('sale-'+itemId);
  var qty = parseInt(input.value);
  if (!qty || qty < 1) return toast('Informe a quantidade');
  try {
    await api('/api/portal/kit-items/'+itemId+'/inform-sale', {method:'POST', token:S.token, body:JSON.stringify({quantity:qty})});
    toast('Venda informada!', 'ok');
    renderPortalKits();
  } catch(e) { toast(e.message); }
}

// ===== PORTAL: MINHAS VENDAS =====
async function renderPortalSales() {
  var v = $('#portal-sales'); if(!v) return;
  v.innerHTML = '<div class="panel"><div class="empty">Carregando...</div></div>';
  try {
    // Buscar dados de vendas
    var salesData = await api('/api/portal/sales', {token: S.token});
    var s = salesData.summary || {};
    var sales = salesData.sales || [];
    
    // Buscar kits da revendedora
    var kitsData = await api('/api/portal/kits', {token: S.token});
    var kits = kitsData.kits || [];
    
    // Buscar histórico de comissões
    var historyData = await api('/api/portal/commission-history', {token: S.token});
    var totalReceived = historyData.total_received_cents || 0;
    var totalPayments = historyData.total_payments || 0;
    
    var f = function(c) { return 'R$ ' + ((c||0)/100).toFixed(2); };
    
    // Separar kits ativos e encerrados
    var activeKits = kits.filter(function(k) { return k.status !== 'encerrado'; });
    var closedKits = kits.filter(function(k) { return k.status === 'encerrado'; });
    
    // Calcular dados apenas do kit ativo
    var activeSummary = { items_sold: 0, total_sold_cents: 0, commission_earned_cents: 0, commission_pct: s.commission_pct || 0 };
    if (activeKits.length > 0) {
      var activeKitIds = activeKits.map(function(k) { return k.id; });
      var activeSales = sales.filter(function(sale) { return activeKitIds.indexOf(sale.kit_id) !== -1; });
      
      activeSales.forEach(function(sale) {
        if (sale.status === 'confirmada') {
          activeSummary.items_sold += sale.quantity;
          var total = sale.quantity * (sale.unit_price_cents || 0);
          activeSummary.total_sold_cents += total;
        }
      });
      
      activeSummary.commission_earned_cents = Math.round(activeSummary.total_sold_cents * activeSummary.commission_pct);
    }
    
    // Cards no topo - apenas kit ativo
    var summaryHtml = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px">' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid var(--bd)">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">📦 Itens Vendidos (Kit Ativo)</div>' +
        '<div style="font-size:22px;font-weight:700;margin-top:4px">' + activeSummary.items_sold + '</div>' +
      '</div>' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid var(--bd)">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">💰 Total Vendido (Kit Ativo)</div>' +
        '<div style="font-size:22px;font-weight:700;color:var(--ac);margin-top:4px">' + f(activeSummary.total_sold_cents) + '</div>' +
      '</div>' +
      '<div style="background:var(--p2);padding:14px;border-radius:var(--r2);border:1px solid rgba(148,184,138,.25)">' +
        '<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">🏆 Minha Comissão (Kit Ativo)</div>' +
        '<div style="font-size:22px;font-weight:700;color:#4ade80;margin-top:4px">' + f(activeSummary.commission_earned_cents) + '</div>' +
      '</div>' +
    '</div>' +
    '<div style="margin-bottom:20px">' +
      '<div style="background:linear-gradient(135deg, #10b981, #059669);padding:20px;border-radius:var(--r2);color:white">' +
        '<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:0.9;margin-bottom:8px">💎 Total de Comissões Recebidas</div>' +
        '<div style="font-size:32px;font-weight:700;margin-bottom:4px">' + f(totalReceived) + '</div>' +
        '<div style="font-size:13px;opacity:0.9">' + totalPayments + ' pagamentos confirmados</div>' +
      '</div>' +
    '</div>';
    
    // Resumo de kits encerrados
    var closedKitsHtml = '';
    if (closedKits.length > 0) {
      closedKitsHtml = '<div class="st">Resumo de Kits Encerrados</div>';
      
      closedKits.forEach(function(kit) {
        // Buscar vendas deste kit
        var kitSales = sales.filter(function(sale) { return sale.kit_id === kit.id; });
        
        var vendidos = 0;
        var devolvidos = 0;
        var totalVendido = 0;
        
        kitSales.forEach(function(sale) {
          if (sale.status === 'confirmada') {
            vendidos += sale.quantity;
            totalVendido += sale.quantity * (sale.unit_price_cents || 0);
          } else if (sale.status === 'rejeitada') {
            devolvidos += sale.quantity;
          }
        });
        
        var comissao = Math.round(totalVendido * (s.commission_pct || 0));
        
        closedKitsHtml += '<div style="background:var(--p2);padding:16px;border-radius:var(--r2);border:1px solid var(--bd);margin-bottom:12px">' +
          '<div style="font-weight:600;margin-bottom:12px">Kit #' + kit.id + ' - ' + esc(kit.status.replace(/_/g, ' ')) + '</div>' +
          '<div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px">' +
            '<div><div style="font-size:10px;color:var(--t3);text-transform:uppercase">Vendidos</div><div style="font-size:18px;font-weight:700;color:#4ade80">' + vendidos + '</div></div>' +
            '<div><div style="font-size:10px;color:var(--t3);text-transform:uppercase">Devolvidos</div><div style="font-size:18px;font-weight:700;color:#3b82f6">' + devolvidos + '</div></div>' +
            '<div><div style="font-size:10px;color:var(--t3);text-transform:uppercase">Comissão</div><div style="font-size:18px;font-weight:700;color:var(--ac)">' + f(comissao) + '</div></div>' +
          '</div>' +
        '</div>';
      });
    }
    
    // Tabela de vendas do kit ativo
    var tableHtml = '';
    if (activeKits.length > 0 && sales.length > 0) {
      var activeKitIds = activeKits.map(function(k) { return k.id; });
      var activeSales = sales.filter(function(sale) { return activeKitIds.indexOf(sale.kit_id) !== -1; });
      
      if (activeSales.length > 0) {
        tableHtml = '<div class="st">Detalhes das Vendas (Kit Ativo)</div>' +
          '<div style="overflow-x:auto"><table style="width:100%;font-size:13px">' +
          '<tr><th>Produto</th><th style="text-align:center">Qtd</th><th style="text-align:right">Preço</th><th style="text-align:right">Total</th><th>Status</th></tr>';
        
        activeSales.forEach(function(sale) {
          var statusColors = {informada:'#ffa500', confirmada:'#4ade80', rejeitada:'#3b82f6'};
          var statusLabels = {informada:'⏳ Informada', confirmada:'✅ Confirmada', rejeitada:'📦 Devolução'};
          var total = sale.quantity * (sale.unit_price_cents||0);
          tableHtml += '<tr><td>' + esc(sale.product_name) + '</td>' +
            '<td style="text-align:center;font-weight:600">' + sale.quantity + '</td>' +
            '<td style="text-align:right">' + f(sale.unit_price_cents) + '</td>' +
            '<td style="text-align:right;font-weight:600">' + f(total) + '</td>' +
            '<td><span style="color:' + (statusColors[sale.status]||'var(--t2)') + '">' + (statusLabels[sale.status]||sale.status) + '</span></td></tr>';
        });
        tableHtml += '</table></div>';
      }
    }
    
    if (activeKits.length === 0 && closedKits.length === 0) {
      tableHtml = '<div class="empty">Nenhuma venda registrada ainda. Informe vendas na aba "Meus Kits"! 📦</div>';
    }
    
    v.innerHTML = '<div class="panel"><div class="st" style="margin-top:0">📊 Minhas Vendas</div>' + summaryHtml + closedKitsHtml + tableHtml + '</div>';
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>'; }
}

// ===== PORTAL: RECADOS =====
async function renderPortalMessages() {
  var v = $('#portal-messages'); if(!v) return;
  try {
    var data = await api('/api/portal/messages', {token: S.token});
    var msgs = data.messages || [];

    var formHtml = '<div class="panel" style="margin-bottom:20px">' +
      '<div class="st" style="margin-top:0">💬 Enviar Recado</div>' +
      '<div style="display:flex;gap:10px">' +
        '<input id="msgInput2" placeholder="Escreva seu recado para a CEO..." style="flex:1" />' +
        '<button class="btn-s" onclick="sendResellerMessage()" style="background:var(--ag);color:var(--bg);border:none;font-weight:600;padding:12px 20px;border-radius:var(--r1);cursor:pointer">Enviar</button>' +
      '</div></div>';

    var listHtml = '';
    if (msgs.length > 0) {
      listHtml = '<div class="panel"><div class="st" style="margin-top:0">Meus Recados (' + msgs.length + ')</div>';
      msgs.forEach(function(m) {
        var readBadge = m.read_at ? '<span style="color:#4ade80;font-size:10px"> ✓ lido</span>' : '<span style="color:#ffa500;font-size:10px"> ⏳ pendente</span>';
        listHtml += '<div class="il" style="flex-direction:column;align-items:flex-start;gap:4px">' +
          '<div style="display:flex;justify-content:space-between;width:100%"><span style="font-weight:500">' + esc(m.message) + '</span>' + readBadge + '</div>' +
          '<span style="font-size:11px;color:var(--t3)">' + esc(m.created_at) + '</span>' +
          '</div>';
      });
      listHtml += '</div>';
    } else {
      listHtml = '<div class="panel"><div class="empty">Nenhum recado enviado ainda.</div></div>';
    }

    v.innerHTML = formHtml + listHtml;
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">' + esc(e.message) + '</div></div>'; }
}

async function sendResellerMessage() {
  var input = $('#msgInput2');
  var msg = input.value.trim();
  if (!msg) return toast('Escreva uma mensagem.');
  try {
    await api('/api/portal/messages', {method:'POST', token:S.token, body:JSON.stringify({message: msg})});
    input.value = '';
    toast('Recado enviado! ✅', 'ok');
    renderPortalMessages();
  } catch(e) { toast(e.message); }
}

async function renderPortalRanking() {
  var v = $('#portal-ranking'); if(!v) return;

    var data = await api('/api/portal/ranking', {token: S.token});

    if (!r) { v.innerHTML = '<div class="panel"><div class="empty">Sem dados de ranking.</div></div>'; return; }

      '<div style="color:var(--t3)">de '+r.total_resellers+' revendedoras</div>' +
      '<div style="font-size:18px;margin-top:12px">R$ '+(r.my_total_cents/100).toFixed(2)+' vendidos</div></div>';
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; }
}

async function renderPortalTips() {
  var v = $('#portal-tips'); if(!v) return;
  try {
    var data = await api('/api/portal/tips', {token: S.token});
    v.innerHTML = '<div class="panel"><div class="st" style="margin-top:0">💡 Dicas</div>' +
      (data.tips && data.tips.length ? data.tips.map(function(t){return '<div class="il"><span>'+esc(t.text)+'</span></div>';}).join('') : '<div class="empty">Nenhuma dica.</div>') +
      '</div>';
  } catch(e) { v.innerHTML = '<div class="panel"><div class="empty">'+esc(e.message)+'</div></div>'; }
}
